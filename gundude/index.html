function loadImages(paths) {
  const out = {};
  return Promise.all(Object.entries(paths).map(([k, src]) => new Promise((res) => {
    const im = new Image();
    im.onload = () => { out[k] = im; res(); };
    im.onerror = () => { out[k] = null; res(); };
    im.src = src;
  }))).then(() => out);
}

function layoutFor(b = B) {
  return {
    stickR: 88,
    skillX: b.designW - 108, skillY: b.designH - 138, skillR: 62,
    // 일시정지 — 전투 동사가 아니라 화면 도구다. 조작 예산(스틱1+버튼1)에 들어가지 않는다.
    // 그래서 엄지가 닿지 않는 상단 구석에 둔다. 실수로 눌리면 안 되기 때문이다.
    pause: { x: b.designW - 74, y: 34, w: 52, h: 52 },
  };
}

function pauseHitTest(x, y, b = B) {
  const r = layoutFor(b).pause;
  return x >= r.x - 8 && x <= r.x + r.w + 8 && y >= r.y - 8 && y <= r.y + r.h + 8;
}

/** 탄약 칸 게이지 — 체력바 바로 아래. 재장전 중에는 전부 비어 보인다. */
function ammoPips(ctx, cx, y, w, mag, max, reloading) {
  const n = Math.max(1, Math.min(24, max));
  const gap = 2;
  const pw = (w - gap * (n - 1)) / n;
  const h = 6;
  const x0 = cx - w / 2;
  for (let i = 0; i < n; i += 1) {
    const filled = !reloading && i < mag;
    ctx.fillStyle = filled ? '#FFE08A' : 'rgba(255,255,255,0.55)';
    ctx.fillRect(x0 + i * (pw + gap), y, pw, h);
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 1.4;
    ctx.strokeRect(x0 + i * (pw + gap), y, pw, h);
  }
}

/** 생명에너지 — 파란 결정. 유전자 조작에 쓰는 재화다. */
function bioIcon(ctx, x, y, size) {
  const r = size / 2;
  ctx.fillStyle = '#5FC8F0';
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = Math.max(1.5, size * 0.14);
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.lineTo(x + r * 0.72, y);
  ctx.lineTo(x, y + r);
  ctx.lineTo(x - r * 0.72, y);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

function outlinedText(ctx, text, x, y, lw = 8) {
  ctx.lineJoin = 'round';
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = lw;
  ctx.strokeText(text, x, y);
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(text, x, y);
}

function formatTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}

/* --------------------------------------------------------------- 배경 */

function drawArena(ctx, world, img) {
  const b = world.b;
  if (img) {
    const A = b.arenaImg;
    const w = b.arenaRx / A.rx, h = b.arenaRy / A.ry;
    ctx.drawImage(img, b.arenaX - A.cx * w, b.arenaY - A.cy * h, w, h);
  } else {
    ctx.save();
    ctx.translate(b.arenaX, b.arenaY);
    ctx.scale(1, b.arenaRy / b.arenaRx);
    inkShape(ctx, wobbleCircle(0, 0, b.arenaRx, 7, 5, 44), '#EDEAE4', 6);
    ctx.restore();
  }
}

function drawEdgeWarning(ctx, world) {
  const b = world.b, p = world.player;
  const danger = Math.max(0, (arenaNorm(p.x, p.y, b, 0) - 0.72) / 0.28);
  if (danger <= 0) return;
  ctx.save();
  ctx.globalAlpha = Math.min(0.45, danger * 0.45);
  ctx.strokeStyle = PALETTE.hpRed;
  ctx.lineWidth = 8 + danger * 12;
  ctx.beginPath();
  ctx.ellipse(b.arenaX, b.arenaY, b.arenaRx - 4, b.arenaRy - 4, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

/* --------------------------------------------------------- 체력 막대 */

/** 머리 위 작은 체력 막대. 플레이어와 적이 같은 방식으로 보여야 읽기 쉽다. */
function headBar(ctx, x, topY, w, hp, maxHp, color = PALETTE.hpRed, h = 6) {
  const bx = x - w / 2;
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(bx, topY, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(bx, topY, w * Math.max(0, Math.min(1, hp / maxHp)), h);
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 1.8;
  ctx.strokeRect(bx, topY, w, h);
}

/* ------------------------------------------------------------- 엔티티 */

function poseOf(e, k) {
  const dur = { [ST.WINDUP]: k.windup, [ST.STRIKE]: k.strike ?? k.active, [ST.RECOVER]: k.recover }[e.state];
  return { walk: e.walk, moving: e.moving, lean: 0, state: e.state, prog: dur ? Math.min(1, e.stateT / dur) : 0 };
}

/** 아레나 타원 안으로 자른다. 절벽 밖까지 뻗는 연출은 화면만 어지럽힌다. */
function clipArena(ctx) {
  ctx.beginPath();
  ctx.ellipse(B.arenaX, B.arenaY, B.arenaRx, B.arenaRy, 0, 0, Math.PI * 2);
  ctx.clip();
}

function drawTelegraph(ctx, e, k, isBoss) {
  if (e.state === ST.WINDUP) {
    const p = Math.min(1, e.stateT / k.windup);
    ctx.save();
    ctx.globalAlpha = 0.25 + p * 0.6;
    ctx.strokeStyle = PALETTE.hpRed;
    ctx.lineWidth = (isBoss ? 6 : 3) + p * 4;
    ctx.setLineDash([8, 7]);
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * (2.0 - p * 0.8), 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 광선 — 예고선이 곧 안전선이다. 선 밖으로 걸어 나가면 안 맞는다.
    if (k.kind === 'beam') {
      const a = Math.atan2(e.aimY, e.aimX);
      ctx.save();
      clipArena(ctx);       // 절벽 밖으로 새는 예고선은 읽기만 방해한다
      ctx.translate(e.x, e.y);
      ctx.rotate(a);
      ctx.globalAlpha = 0.14 + p * 0.30;
      ctx.fillStyle = PALETTE.hpRed;
      ctx.fillRect(0, -k.width / 2, k.length, k.width);
      ctx.globalAlpha = 0.5 + p * 0.5;
      ctx.strokeStyle = PALETTE.hpRed;
      ctx.lineWidth = 3;
      ctx.setLineDash([14, 10]);
      ctx.beginPath();
      ctx.moveTo(0, -k.width / 2); ctx.lineTo(k.length, -k.width / 2);
      ctx.moveTo(0, k.width / 2); ctx.lineTo(k.length, k.width / 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    // 회전 난사 — 어느 쪽으로 도는지 화살표로 알린다
    if (k.kind === 'spiral') {
      const a0 = Math.atan2(e.aimY, e.aimX);
      ctx.globalAlpha = 0.25 + p * 0.45;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.r * 2.6, a0, a0 + k.turn);
      ctx.stroke();
    }
    // 소환 — 부하가 어디 떨어지는지 미리 찍는다
    if (k.kind === 'summon') {
      ctx.globalAlpha = 0.25 + p * 0.4;
      ctx.lineWidth = 4;
      for (let i = 0; i < k.count; i += 1) {
        const a = (i / k.count) * Math.PI * 2;
        const d = e.r + 88;
        ctx.beginPath();
        ctx.arc(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, 20 * (0.5 + p * 0.5), 0, Math.PI * 2);
        ctx.stroke();
      }
    }
    // 원거리 잡몹 — 총구에서 조준선이 뻗는다. 미사일이 어디로 오는지 미리 보여야 한다.
    if (k.attack === 'shoot') {
      const a = Math.atan2(e.aimY, e.aimX);
      ctx.globalAlpha = 0.20 + p * 0.55;
      ctx.strokeStyle = PALETTE.hpRed;
      ctx.lineWidth = 2 + p * 3;
      ctx.setLineDash([12, 9]);
      ctx.beginPath();
      ctx.moveTo(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r);
      ctx.lineTo(e.x + Math.cos(a) * (k.range ?? 320), e.y + Math.sin(a) * (k.range ?? 320));
      ctx.stroke();
      ctx.setLineDash([]);
      // 발사 직전 총구가 달아오른다
      ctx.globalAlpha = p * p;
      ctx.fillStyle = '#FFE08A';
      ctx.beginPath();
      ctx.arc(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, 4 + p * 7, 0, Math.PI * 2);
      ctx.fill();
    }
    // 돌진·박치기는 어디로 오는지 선으로 보여준다
    if (k.lunge > 0 || k.kind === 'charge') {
      const a = Math.atan2(e.aimY, e.aimX);
      const len = k.kind === 'charge' ? 300 : k.lunge + e.r * 2;
      ctx.globalAlpha = 0.18 + p * 0.35;
      ctx.lineWidth = e.r * 0.9;
      ctx.beginPath();
      ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(a) * len, e.y + Math.sin(a) * len);
      ctx.stroke();
    }
    if (k.kind === 'slam') {
      ctx.globalAlpha = 0.15 + p * 0.35;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(e.x, e.y, k.radius * (0.5 + p * 0.5), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  } else if (e.state === ST.STRIKE && k.attack !== 'shoot' && !isBoss) {
    const p = Math.min(1, e.stateT / k.strike);
    const a = Math.atan2(e.aimY, e.aimX);
    ctx.save();
    ctx.globalAlpha = 0.9 * (1 - p);
    ctx.strokeStyle = PALETTE.ink;
    ctx.lineWidth = 8 * (1 - p) + 2;
    ctx.beginPath();
    ctx.arc(e.x + Math.cos(a) * e.r, e.y + Math.sin(a) * e.r, e.r * 1.5, a - 1.2, a + 1.2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawEnemy(ctx, world, e) {
  const b = world.b;
  const k = e.isBoss ? (e.patterns?.[e.pattern] ?? { windup: 1, recover: 1 }) : b.kinds[e.kind];
  ctx.save();

  if (e.state === ST.FALL) {
    const f = Math.min(1, e.stateT / b.fallSec);
    ctx.globalAlpha = 1 - f;
    ctx.translate(e.x, e.y + f * 200);
    ctx.rotate(f * 1.6);
    ctx.scale(1 - f * 0.6, 1 - f * 0.6);
    ctx.translate(-e.x, -e.y);
  } else if (e.state === ST.DROP) {
    const dur = b.spawnDropSec * (e.isBoss ? 1.6 : 1);
    const d = Math.min(1, e.stateT / dur);
    ctx.globalAlpha = Math.min(1, d * 2.2);
    ctx.save();
    ctx.globalAlpha = 0.22 * d;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.r * (0.4 + d * 0.7), e.r * 0.3 * (0.4 + d * 0.7), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.translate(0, -(1 - d) * 170);
  } else {
    drawTelegraph(ctx, e, k, e.isBoss);
  }

  // 보스 경직 = 딜 타이밍. 금색 링으로 "지금이야" 를 알린다.
  if (bossVulnerable(e)) {
    ctx.save();
    ctx.globalAlpha = 0.45 + Math.sin(world.t * 14) * 0.25;
    ctx.strokeStyle = PALETTE.gold;
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r * 1.5, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  drawCharacter(ctx, {
    kind: e.isBoss ? `boss_${e.bossId ?? 'sergent'}` : e.kind,
    x: e.x, y: e.y + e.r * 0.85,
    size: e.r * (e.isBoss ? 1.55 : 1.75),
    seed: e.seed, facing: e.facing,
    pose: (e.state === ST.DROP || e.state === ST.FALL) ? null : poseOf(e, k),
    flash: e.hitFlash,
  });

  if (e.summoned && e.state !== ST.FALL) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#3E9E5B'; ctx.lineWidth = 3;
    ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 1.35, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  if (e.state !== ST.DROP && e.state !== ST.FALL && e.hp < e.maxHp && !e.isBoss) {
    headBar(ctx, e.x, e.y - e.r * 2.3, e.r * 2.0, e.hp, e.maxHp);
  }
  ctx.restore();
}

function drawPlayer(ctx, world) {
  const p = world.player;
  const shot = world.shot;
  const blink = p.invuln > 0 && Math.floor(world.t * 18) % 2 === 0;

  // 발밑 링 — 지금 쏠 수 있는 상태인가를 알린다.
  // 멈춰 있고 장전이 끝나 있으면 금색으로 꽉 찬다. 이동 중이면 흐려진다.
  const charging = Math.max(0, Math.min(1,
    p.reloading > 0 ? 1 - p.reloading / world.shot.reload
      : (p.fireCd > 0 ? 1 - p.fireCd / world.shot.interval : 1)));
  const ready = !p.moving && p.reloading <= 0 && p.fireCd <= 0;
  ctx.save();
  ctx.globalAlpha = p.moving ? 0.3 : 0.85;
  ctx.strokeStyle = '#9AA7B0';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.ellipse(p.x, p.y + B.playerR * 0.85, B.playerR * 1.55, B.playerR * 0.54, 0, 0, Math.PI * 2);
  ctx.stroke();
  if (charging > 0) {
    ctx.globalAlpha = p.moving ? 0.55 : 0.95;
    ctx.strokeStyle = ready ? PALETTE.gold : '#B8C6D0';
    ctx.lineWidth = ready ? 5 : 4;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + B.playerR * 0.85, B.playerR * 1.55, B.playerR * 0.54,
      0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * charging);
    ctx.stroke();
  }
  // 총구 들림 — 탄착이 벌어지는 만큼 조준선도 벌어진다
  if (ready && p.bloom > 0.001) {
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#C46B5A';
    ctx.lineWidth = 3;
    const spread = (world.shot.spread + p.bloom) * 190;
    ctx.beginPath();
    ctx.moveTo(p.x + Math.cos(p.aimA - spread) * 46, p.y + Math.sin(p.aimA - spread) * 46);
    ctx.lineTo(p.x + Math.cos(p.aimA) * 30, p.y + Math.sin(p.aimA) * 30);
    ctx.lineTo(p.x + Math.cos(p.aimA + spread) * 46, p.y + Math.sin(p.aimA + spread) * 46);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  if (blink) ctx.globalAlpha = 0.45;
  // 반동 — 쏜 방향의 반대로 몸이 밀린다
  const rx = -Math.cos(p.recoilA) * p.recoil * 0.35;
  const ry = -Math.sin(p.recoilA) * p.recoil * 0.35;
  ctx.translate(rx, ry);
  drawCharacter(ctx, {
    kind: 'dude', x: p.x, y: p.y + B.playerR * 0.85,
    size: B.playerR * 2.5, seed: 1337, facing: p.facing,
    aimA: p.aimA,
    gunShape: weaponById(world.weapon).shape,   // 든 총이 그려지는 총이어야 한다
    pose: { walk: p.walk, moving: p.moving, lean: p.lean * p.facing, state: null, prog: 0 },
  });
  ctx.restore();

  // 체력바는 가득 찼을 때 보이지 않는다. 캐릭터를 가리지 않게 충분히 위로 올린다.
  if (p.hp < p.maxHp) {
    headBar(ctx, p.x, p.y - B.playerR * 4.4, B.playerR * 2.8, p.hp, p.maxHp, PALETTE.hpRed, 7);
  }
  // 탄약은 칸으로. 남은 발수가 숫자보다 형태로 먼저 읽혀야 한다.
  ammoPips(ctx, p.x, p.y - B.playerR * 3.5, B.playerR * 2.8, p.mag, world.shot.mag, p.reloading > 0);

  // 재장전은 화면 아래를 안 봐도 알아야 한다 — 머리 위에 진행 링을 띄운다
  if (p.reloading > 0) {
    const f = 1 - p.reloading / world.shot.reload;
    const ry = p.y - B.playerR * 5.4;
    ctx.save();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(p.x, ry, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = PALETTE.slate; ctx.lineWidth = 7;
    ctx.beginPath(); ctx.arc(p.x, ry, 13, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.stroke();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, ry, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  if (p.hurtFlash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(0.8, p.hurtFlash * 4);
    ctx.fillStyle = PALETTE.hpRed;
    ctx.beginPath();
    ctx.arc(p.x, p.y - B.playerR, B.playerR * 1.9, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/**
 * 유전자 조각과 보급품.
 *
 * 이 그림이 해야 할 말은 두 가지다: **저기 있다**, 그리고 **곧 사라진다.**
 * 사라진다는 걸 못 읽으면 "지금 갈까" 라는 결단이 안 생긴다.
 */
function drawPickups(ctx, world) {
  const b = world.b;
  const mag = world.stats.magnetRadius;

  // 흡인 범위 — 어디까지 서 있으면 딸려오는지가 보여야 위치를 고를 수 있다
  if (mag > b.magnetBaseR * 1.5) {
    const p = world.player;
    ctx.save();
    ctx.globalAlpha = 0.13;
    ctx.strokeStyle = '#5FC8F0';
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 11]);
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, mag, mag * 0.8, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  for (const it of world.pickups) {
    const left = it.life - it.t;
    const blink = it.kind === 'shard' ? b.shardBlink : b.supplyBlink;
    // 사라지기 직전에는 깜빡인다. 남은 시간이 곧 결단의 시간이다.
    if (left < blink && Math.floor(it.t * 9) % 2 === 0) continue;

    const bob = Math.sin(world.t * 3.4 + (it.seed % 100) * 0.11) * 3;
    const x = it.x, y = it.y + bob;
    ctx.save();

    if (it.kind === 'shard' || it.kind === 'cluster') {
      const r = it.kind === 'cluster' ? 12 : b.shardR * (1 + Math.min(0.35, it.v / 20));
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = '#5FC8F0';
      ctx.beginPath(); ctx.ellipse(x, y, r * 1.7, r * 1.7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (it.kind === 'cluster') {
        // 뭉치 — 조각 셋이 겹쳐 있다. 하나짜리와 한눈에 구분되어야 한다.
        bioIcon(ctx, x - r * 0.85, y + r * 0.5, r * 1.7);
        bioIcon(ctx, x + r * 0.85, y + r * 0.5, r * 1.7);
        bioIcon(ctx, x, y - r * 0.35, r * 2);
      } else {
        bioIcon(ctx, x, y, r * 2);
      }
    } else if (it.kind === 'heart') {
      const r = b.supplyR;
      ctx.fillStyle = '#E0604F';
      ctx.strokeStyle = PALETTE.ink;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(x, y + r * 0.85);
      ctx.bezierCurveTo(x - r * 1.5, y - r * 0.25, x - r * 0.5, y - r * 1.15, x, y - r * 0.35);
      ctx.bezierCurveTo(x + r * 0.5, y - r * 1.15, x + r * 1.5, y - r * 0.25, x, y + r * 0.85);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      // 돈주머니 — 어두운 자루만 그리면 바위와 구분이 안 됐다. 금빛을 얹는다.
      const r = b.supplyR * 1.25;
      ctx.save();
      ctx.globalAlpha = 0.30;
      ctx.fillStyle = PALETTE.gold;
      ctx.beginPath(); ctx.arc(x, y, r * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#8A6A4A';
      ctx.strokeStyle = PALETTE.ink;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.62, y - r * 0.5);
      ctx.quadraticCurveTo(x - r * 1.3, y + r * 0.6, x, y + r * 1.05);
      ctx.quadraticCurveTo(x + r * 1.3, y + r * 0.6, x + r * 0.62, y - r * 0.5);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // 자루 입구를 묶은 끈
      ctx.beginPath();
      ctx.moveTo(x - r * 0.72, y - r * 0.55);
      ctx.lineTo(x + r * 0.72, y - r * 0.55);
      ctx.stroke();
      // 넘치는 금화
      drawGold(ctx, x - r * 0.4, y - r * 0.85, r * 0.72, 4);
      drawGold(ctx, x + r * 0.38, y - r * 0.78, r * 0.62, 7);
      drawGold(ctx, x, y + r * 0.25, r * 0.85, 11);
    }

    // 바닥 그림자 — 공중에 뜬 게 아니라 땅에 놓인 것이다
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(it.x, it.y + 12, 9, 3.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawShots(ctx, world) {
  ctx.save();
  ctx.strokeStyle = PALETTE.ink;
  ctx.lineWidth = 3;
  for (const b of world.bullets) {
    const d = Math.hypot(b.vx, b.vy) || 1;
    const len = b.blast > 0 ? 9 : 15;
    ctx.fillStyle = b.blast > 0 ? PALETTE.gold : PALETTE.slate;
    ctx.beginPath();
    ctx.moveTo(b.x - (b.vx / d) * len, b.y - (b.vy / d) * len);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.blast > 0 ? 6 : 4.5, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  for (const s of world.hostileShots) {
    ctx.fillStyle = PALETTE.hpRed;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawFx(ctx, world) {
  for (const f of world.fx) {
    const k = f.t / f.life;
    ctx.save();
    if (f.type === 'muzzle') {
      // 총구 섬광 — 무기마다 크기가 다르다
      const s = (f.s ?? 1) * (1 - k);
      ctx.globalAlpha = 1 - k;
      ctx.translate(f.x, f.y);
      ctx.rotate(f.a);
      ctx.fillStyle = '#FFF3B0';
      ctx.strokeStyle = PALETTE.ink;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(20 * s, -9 * s);
      ctx.lineTo(30 * s, 0);
      ctx.lineTo(20 * s, 9 * s);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (f.type === 'shell') {
      const g = hash01(f.seed, 1);
      ctx.globalAlpha = 1 - k;
      const dx = Math.cos(f.a + Math.PI * 0.6) * (18 + g * 14) * k;
      const dy = Math.sin(f.a + Math.PI * 0.6) * (18 + g * 14) * k + k * k * 46;
      ctx.translate(f.x + dx, f.y + dy);
      ctx.rotate(k * 9 + g * 3);
      ctx.fillStyle = PALETTE.goldDark;
      ctx.strokeStyle = PALETTE.ink;
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.roundRect(-3, -1.6, 6, 3.2, 1.4);
      ctx.fill(); ctx.stroke();
    } else if (f.type === 'shockRing') {
      const r = (f.R ?? B.skillRadius) * (1 - (1 - Math.min(1, k * 1.3)) ** 3);
      ctx.globalAlpha = 0.85 * (1 - k);
      ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 16 * (1 - k) + 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
    } else if (f.type === 'beam') {
      ctx.globalAlpha = 1 - k;
      clipArena(ctx);
      ctx.translate(f.x, f.y);
      ctx.rotate(f.a);
      const wgrow = f.w * (1 + (1 - k) * 0.5);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, -wgrow / 2, f.len, wgrow);
      ctx.fillStyle = PALETTE.hpRed;
      ctx.fillRect(0, -wgrow * 0.28, f.len, wgrow * 0.56);
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3;
      ctx.strokeRect(0, -wgrow / 2, f.len, wgrow);
    } else if (f.type === 'slam') {
      ctx.globalAlpha = 0.9 * (1 - k);
      ctx.strokeStyle = PALETTE.hpRed; ctx.lineWidth = 18 * (1 - k) + 4;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.35 + k * 0.75), 0, Math.PI * 2); ctx.stroke();
    } else if (f.type === 'blast') {
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = '#FFE08A';
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
      const r = f.r * (0.4 + k * 0.7);
      inkShape(ctx, wobbleCircle(f.x, f.y, r, 11, r * 0.16, 11), '#FFE08A', 4);
    } else if (f.type === 'hit') {
      ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3;
      const r = 5 + k * 13;
      for (let i = 0; i < 4; i += 1) {
        const a = (i / 4) * Math.PI * 2 + 0.5;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(a) * r * 0.4, f.y + Math.sin(a) * r * 0.4);
        ctx.lineTo(f.x + Math.cos(a) * r, f.y + Math.sin(a) * r);
        ctx.stroke();
      }
    } else if (f.type === 'pop') {
      ctx.globalAlpha = 1 - k;
      const r = 7 + k * 24;
      inkShape(ctx, wobbleCircle(f.x, f.y, r, 5, r * 0.18, 9), null, 4);
    } else if (f.type === 'drop') {
      ctx.globalAlpha = 1 - k * k;
      const y = f.y - k * 44;
      ctx.font = 'bold 23px system-ui, sans-serif';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      drawGold(ctx, f.x - 28, y, 15, 3);
      outlinedText(ctx, `+${f.m}`, f.x - 18, y, 6);
      bioIcon(ctx, f.x + 14, y, 13);
      outlinedText(ctx, `+${f.bio}`, f.x + 26, y, 6);
    } else if (f.type === 'heal') {
      ctx.globalAlpha = 1 - k;
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#7BD69A';
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 5; ctx.lineJoin = 'round';
      const hy = f.y - k * 26;
      ctx.strokeText(`+${f.v}`, f.x, hy);
      ctx.fillText(`+${f.v}`, f.x, hy);
    } else if (f.type === 'take') {
      ctx.globalAlpha = 1 - k;
      const r = 6 + k * 22;
      ctx.strokeStyle = f.k === 'heart' ? '#E0604F' : (f.k === 'pouch' ? PALETTE.gold : '#5FC8F0');
      ctx.lineWidth = 5 * (1 - k) + 1;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.font = 'bold 21px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const label = f.k === 'heart' ? `+${f.v} HP` : (f.k === 'pouch' ? `+${f.v}` : `+${f.v}`);
      outlinedText(ctx, label, f.x, f.y - 16 - k * 22, 6);
    } else if (f.type === 'expire') {
      // 흘린 것 — 사라졌다는 걸 봐야 다음엔 주우러 간다
      ctx.globalAlpha = (1 - k) * 0.75;
      ctx.strokeStyle = '#7C8B96';
      ctx.lineWidth = 3;
      const r = 4 + k * 15;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
    } else if (f.type === 'supplyCall') {
      // 보급품이 어디 떨어졌는지 한 번 크게 찍어 준다
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.strokeStyle = f.k === 'heart' ? '#E0604F' : (f.k === 'pouch' ? PALETTE.gold : '#5FC8F0');
      ctx.lineWidth = 6;
      const r = 130 * (1 - k) + 22;
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([7, 8]);
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, 34, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.font = 'bold 20px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      outlinedText(ctx, f.k === 'heart' ? '보급 — 회복' : (f.k === 'pouch' ? '보급 — 자금' : '보급 — 조각'),
        f.x, f.y - 52, 6);
    } else if (f.type === 'waveBanner') {
      const e = Math.min(1, k * 4) * Math.min(1, (1 - k) * 4);
      ctx.globalAlpha = e;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = 'bold 68px system-ui, sans-serif';
      outlinedText(ctx, isBossWave(f.n) ? 'BOSS' : `WAVE ${f.n}`, B.designW / 2, B.designH * 0.34, 10);
    } else if (f.type === 'playerHit') {
      // 화면 전체를 빨갛게 덮으면 정작 무엇에 맞았는지가 안 보인다.
      // 가장자리만 물들여 "맞았다" 를 알리고 중앙은 열어 둔다.
      const g2 = ctx.createRadialGradient(B.designW / 2, B.designH / 2, B.designH * 0.16,
        B.designW / 2, B.designH / 2, B.designH * 0.58);
      g2.addColorStop(0, 'rgba(221,49,49,0)');
      g2.addColorStop(1, `rgba(221,49,49,${((1 - k) * 0.62).toFixed(3)})`);
      ctx.fillStyle = g2;
      ctx.fillRect(0, 0, B.designW, B.designH);
    }
    ctx.restore();
  }
}

/* ----------------------------------------------------------------- HUD */

function drawTopBar(ctx, world) {
  const b = world.b;
  const boss = world.enemies.find((e) => e.isBoss && e.state !== ST.FALL);
  const x = 46, w = b.designW - 92, y = 52, h = 30;

  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fill();

  if (boss) {
    ctx.fillStyle = '#7B2020';
    ctx.beginPath();
    ctx.roundRect(x + 3, y + 3, Math.max(0, (w - 6) * (boss.hp / boss.maxHp)), h - 6, (h - 6) / 2);
    ctx.fill();
  } else {
    const total = Math.max(1, world.waveTotal);
    const f = Math.min(1, world.waveKilled / total);
    ctx.fillStyle = PALETTE.gold;
    ctx.beginPath();
    ctx.roundRect(x + 3, y + 3, Math.max(0, (w - 6) * f), h - 6, (h - 6) / 2);
    ctx.fill();
    // 편성 수만큼 눈금 — 몇 마리가 남았는지가 한눈에 보여야 한다
    ctx.strokeStyle = 'rgba(0,0,0,0.18)';
    ctx.lineWidth = 2;
    const ticks = Math.min(20, total);
    for (let i = 1; i < ticks; i += 1) {
      const tx = x + 3 + (w - 6) * (i / ticks);
      ctx.beginPath(); ctx.moveTo(tx, y + 5); ctx.lineTo(tx, y + h - 5); ctx.stroke();
    }
  }
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.stroke();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 20px system-ui, sans-serif';
  const label = boss
    ? (boss.name ?? 'BOSS')
    : `스테이지 ${stageOf(world.wave, b)} — ${waveInStage(world.wave, b)}/${b.wavesPerStage}` +
      `   ${world.waveKilled} / ${world.waveTotal}`;
  outlinedText(ctx, label, b.designW / 2, y + h / 2 + 1, 6);

  // 보스가 예비동작에 들어가면 무엇을 하려는지 글로 알린다.
  // "예고 없는 죽음 금지" 는 그림만으로는 부족할 때가 있다.
  if (boss && boss.state === ST.WINDUP) {
    const pat = boss.patterns?.[boss.pattern];
    if (pat?.tell) {
      ctx.font = 'bold 19px system-ui, sans-serif';
      outlinedText(ctx, pat.tell, b.designW / 2, y + h + 20, 6);
    }
  } else if (boss) {
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = '#F0C0C0';
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    const sub = boss.title ?? '';
    if (sub) { ctx.strokeText(sub, b.designW / 2, y + h + 18); ctx.fillText(sub, b.designW / 2, y + h + 18); }
  }

  if (!boss && isBossWave(world.wave + 1, b)) {
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = PALETTE.hpRed;
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 5; ctx.lineJoin = 'round';
    ctx.strokeText('다음 웨이브 — 보스', b.designW / 2, y + h + 17);
    ctx.fillText('다음 웨이브 — 보스', b.designW / 2, y + h + 17);
  }
}

function drawHud(ctx, world, images) {
  const b = world.b, p = world.player;
  const L = layoutFor(b);

  drawTopBar(ctx, world);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 42px system-ui, sans-serif';
  outlinedText(ctx, formatTime(world.t), b.designW / 2, 148);

  // 재화 두 종류 — 골드(로비용) · 부품(상점용)
  ctx.textAlign = 'left';
  ctx.font = 'bold 26px system-ui, sans-serif';
  drawGold(ctx, 40, 148, 24, 3);
  outlinedText(ctx, `${world.money}`, 58, 148, 6);
  bioIcon(ctx, b.designW - 100, 148, 22);
  outlinedText(ctx, `${world.bio}`, b.designW - 84, 148, 6);

  // 무기·탄창 — 지금 몇 발 남았나가 판단의 재료다
  const wep = weaponById(world.weapon);
  const bx = 34, by = b.designH - 196;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px system-ui, sans-serif';
  outlinedText(ctx, wep.name, bx, by, 6);
  ctx.font = 'bold 40px system-ui, sans-serif';
  if (p.reloading > 0) {
    ctx.fillStyle = PALETTE.slate;
    outlinedText(ctx, '재장전…', bx, by + 38, 7);
    const w2 = 150, h2 = 8;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(bx, by + 62, w2, h2);
    ctx.fillStyle = PALETTE.slate;
    ctx.fillRect(bx, by + 62, w2 * (1 - p.reloading / world.shot.reload), h2);
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2;
    ctx.strokeRect(bx, by + 62, w2, h2);
  } else {
    const low = p.mag <= Math.max(1, Math.ceil(world.shot.mag * 0.25));
    ctx.lineJoin = 'round';
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 8;
    ctx.strokeText(`${p.mag}`, bx, by + 38);
    ctx.fillStyle = low ? '#FF8A7A' : '#FFFFFF';
    ctx.fillText(`${p.mag}`, bx, by + 38);
    const wq = ctx.measureText(`${p.mag}`).width;
    ctx.font = 'bold 22px system-ui, sans-serif';
    outlinedText(ctx, `/ ${world.shot.mag}`, bx + wq + 8, by + 46, 6);
  }

  const st = world.__stick;
  if (st) {
    ctx.save();
    ctx.globalAlpha = 0.42;
    inkShape(ctx, wobbleCircle(st.ox, st.oy, L.stickR, 21, 3, 18), '#FFFFFF', 5);
    const dx = st.x - st.ox, dy = st.y - st.oy;
    const d = Math.hypot(dx, dy) || 1;
    const kk = Math.min(1, d / L.stickR);
    ctx.globalAlpha = 0.78;
    inkShape(ctx, wobbleCircle(st.ox + (dx / d) * L.stickR * kk, st.oy + (dy / d) * L.stickR * kk,
      L.stickR * 0.4, 22, 2, 14), PALETTE.slate, 5);
    ctx.restore();
  }

  const ready = p.skillReady > 0;
  ctx.save();
  ctx.globalAlpha = ready ? 1 : 0.5;
  if (images.skill) {
    const s = (L.skillR * 2.1) / images.skill.width;
    ctx.drawImage(images.skill, L.skillX - images.skill.width * s / 2,
      L.skillY - images.skill.height * s / 2, images.skill.width * s, images.skill.height * s);
  } else {
    inkShape(ctx, wobbleCircle(L.skillX, L.skillY, L.skillR, 31, 3, 18), PALETTE.gold, 6);
  }
  ctx.restore();

  if (!ready) {
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.moveTo(L.skillX, L.skillY);
    ctx.arc(L.skillX, L.skillY, L.skillR, -Math.PI / 2,
      -Math.PI / 2 + Math.PI * 2 * (p.skillCd / world.stats.skillCooldown));
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px system-ui, sans-serif';
    outlinedText(ctx, p.skillCd.toFixed(1), L.skillX, L.skillY + 10);
  } else {
    ctx.save();
    ctx.globalAlpha = 0.5 + Math.sin(world.t * 6) * 0.25;
    ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(L.skillX, L.skillY, L.skillR * 1.14, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }

  // 충격파 보유 수 — '이중 기폭' 을 배우면 두 발을 들고 다닌다
  if (world.stats.skillCharges > 1) {
    const n = world.stats.skillCharges;
    for (let i = 0; i < n; i += 1) {
      const cx = L.skillX + (i - (n - 1) / 2) * 22;
      const cy = L.skillY + L.skillR + 20;
      ctx.beginPath(); ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fillStyle = i < p.skillReady ? PALETTE.gold : 'rgba(255,255,255,0.45)';
      ctx.fill();
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();
    }
  }

  // 일시정지 버튼
  const pb = L.pause;
  ctx.save();
  ctx.globalAlpha = 0.82;
  ctx.fillStyle = PALETTE.parchment;
  ctx.beginPath(); ctx.roundRect(pb.x, pb.y, pb.w, pb.h, 14); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(pb.x, pb.y, pb.w, pb.h, 14); ctx.stroke();
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillRect(pb.x + pb.w * 0.30, pb.y + pb.h * 0.26, pb.w * 0.12, pb.h * 0.48);
  ctx.fillRect(pb.x + pb.w * 0.58, pb.y + pb.h * 0.26, pb.w * 0.12, pb.h * 0.48);
  ctx.restore();
}

/**
 * 사망 연출 — 죽은 자리로 화면이 파고들고, 무엇에 당했는지 글로 남는다.
 *
 * 설계 기둥 2번("죽음에는 읽을 수 있는 이유가 있어야 한다")은 그 순간에 지켜져야 한다.
 * 다음 화면으로 곧장 넘겨 버리면 플레이어는 자기가 왜 죽었는지 모른 채 로비에 앉는다.
 */
function drawDeathCine(ctx, world, k) {
  const b = world.b;
  ctx.save();
  // 가장자리부터 어두워진다 — 시선이 죽은 자리에 모인다
  const g = ctx.createRadialGradient(b.designW / 2, b.designH / 2, b.designH * 0.10,
    b.designW / 2, b.designH / 2, b.designH * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(6,12,18,${(0.30 + k * 0.55).toFixed(3)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, b.designW, b.designH);

  const fade = Math.min(1, Math.max(0, (k - 0.25) / 0.35));
  ctx.globalAlpha = fade;
  // 글자 뒤에 판을 깐다. 확대된 캐릭터와 겹치면 사인이 안 읽힌다.
  const py = b.designH * 0.26, ph = 176;
  ctx.fillStyle = 'rgba(8,14,20,0.62)';
  ctx.beginPath(); ctx.roundRect(40, py, b.designW - 80, ph, 24); ctx.fill();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 58px system-ui, sans-serif';
  outlinedText(ctx, '쓰러졌다', b.designW / 2, py + 50, 11);
  if (world.killedBy) {
    // 조사를 붙이면 "스스로 물러났다에 당했다" 같은 문장이 나온다.
    // 이미 문장으로 끝나는 사유는 그대로 쓴다.
    const line = /다$/.test(world.killedBy) ? world.killedBy : `${world.killedBy}에 당했다`;
    ctx.font = 'bold 23px system-ui, sans-serif';
    outlinedText(ctx, line, b.designW / 2, py + 104, 7);
  }
  ctx.font = 'bold 20px system-ui, sans-serif';
  outlinedText(ctx, `${formatTime(world.t)} 생존 · 웨이브 ${world.wave}`, b.designW / 2, py + 142, 6);
  ctx.restore();
}

/**
 * 스테이지 돌파 연출 — 보스를 잡고 상점이 열리기 전의 한 박자.
 * 수송선이 내려와 보급을 떨군다. 보상 화면이 갑자기 튀어나오지 않게 하는 장치다.
 */
function drawStageClear(ctx, world, images, cine) {
  const b = world.b;
  const k = Math.min(1, cine.t / cine.life);
  ctx.save();

  // 화면이 서서히 가라앉는다
  ctx.globalAlpha = Math.min(0.55, k * 1.4);
  ctx.fillStyle = '#101E2A';
  ctx.fillRect(0, 0, b.designW, b.designH);
  ctx.restore();

  // 수송선 — 위에서 내려와 잠시 머물고 다시 오른다
  const drop = k < 0.55 ? (k / 0.55) : 1 - (k - 0.55) / 0.45 * 0.35;
  const hy = -120 + drop * 430;
  if (images.heli) {
    const sc = 250 / images.heli.width;
    ctx.save();
    ctx.translate(b.designW / 2 + Math.sin(cine.t * 2.2) * 10, hy);
    ctx.drawImage(images.heli, -images.heli.width * sc / 2, -images.heli.height * sc / 2,
      images.heli.width * sc, images.heli.height * sc);
    ctx.restore();
    // 하강 기류
    ctx.save();
    ctx.globalAlpha = 0.18 * drop;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(b.designW / 2 - 60, hy + 30);
    ctx.lineTo(b.designW / 2 + 60, hy + 30);
    ctx.lineTo(b.designW / 2 + 150, b.arenaY + 80);
    ctx.lineTo(b.designW / 2 - 150, b.arenaY + 80);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  const e = Math.min(1, k * 3.2) * Math.min(1, (1 - k) * 4.5);
  ctx.save();
  ctx.globalAlpha = Math.max(0, e);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 30px system-ui, sans-serif';
  outlinedText(ctx, '보스 격파', b.designW / 2, b.designH * 0.52, 8);
  ctx.font = 'bold 64px system-ui, sans-serif';
  outlinedText(ctx, `스테이지 ${cine.stage} 돌파`, b.designW / 2, b.designH * 0.60, 11);
  ctx.font = 'bold 22px system-ui, sans-serif';
  outlinedText(ctx, '보급이 내려온다', b.designW / 2, b.designH * 0.66, 6);
  ctx.restore();
}

/* ------------------------------------------------------------- 전체 */

function renderWorld(ctx, world, images, t, stick, cam = null) {
  const b = world.b;
  world.__stick = stick;

  ctx.fillStyle = '#DDE6EC';
  ctx.fillRect(0, 0, b.designW, b.designH);

  ctx.save();
  // 카메라 — 사망 연출에서 죽은 자리로 파고든다
  if (cam && cam.zoom !== 1) {
    ctx.translate(b.designW / 2, b.designH / 2);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-cam.x, -cam.y);
  }
  if (world.shake > 0.2) {
    const s = world.shake;
    ctx.translate((hash01(Math.floor(t * 90), 1) - 0.5) * s, (hash01(Math.floor(t * 90), 2) - 0.5) * s);
  }

  drawArena(ctx, world, images.arena);
  drawEdgeWarning(ctx, world);

  // 배경 헬기는 연출 중에는 숨긴다 — 수송선이 두 대로 보인다.
  if (images.heli && !world.cine) {
    const hx = ((t * 34) % (b.designW + 420)) - 210;
    const s = 168 / images.heli.width;
    ctx.drawImage(images.heli, hx - images.heli.width * s / 2,
      250 + Math.sin(t * 1.3) * 8 - images.heli.height * s / 2,
      images.heli.width * s, images.heli.height * s);
  }

  drawPickups(ctx, world);

  const list = world.enemies.slice().sort((a, c) => a.y - c.y);
  const py = world.player.y;
  let drew = false;
  for (const e of list) {
    if (!drew && e.y > py) { drawPlayer(ctx, world); drew = true; }
    drawEnemy(ctx, world, e);
  }
  if (!drew) drawPlayer(ctx, world);

  drawShots(ctx, world);
  drawFx(ctx, world);
  ctx.restore();

  if (world.cine?.type === 'stageClear') { drawStageClear(ctx, world, images, world.cine); return; }
  if (cam?.hideHud) return;
  drawHud(ctx, world, images);
}

/**
 * 게임 밖 화면들 — 타이틀 · 로비(영구 성장) · 상점(인게임 무기).
 *
 * 레이아웃은 순수 함수로 뽑는다. 그려야 할 위치와 탭 판정이 같은 값을 쓰게 하려고.
 * 성장이 두 갈래이므로 화면도 둘로 나뉜다:
 *   로비 = 골드로 사는 영구 스탯 (숫자가 커진다)
 *   상점 = 부품으로 사는 무기 (노는 방법이 바뀐다)
 */

function panel(ctx, x, y, w, h, fill, lw = 5, r = 18) {
  ctx.fillStyle = fill;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = lw;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke();
}

const inside = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

/* ============================================================ 타이틀 */

function titleLayout(b = B) {
  return {
    start: { x: 84, y: 800, w: b.designW - 168, h: 118 },
    lobby: { x: 84, y: 946, w: b.designW - 168, h: 92 },
  };
}

function titleHitTest(x, y, b = B) {
  const L = titleLayout(b);
  if (inside(L.start, x, y)) return { type: 'start' };
  if (inside(L.lobby, x, y)) return { type: 'lobby' };
  return { type: 'none' };
}

function renderTitle(ctx, state, t, b = B) {
  const L = titleLayout(b);
  ctx.fillStyle = PALETTE.backdrop;
  ctx.fillRect(0, 0, b.designW, b.designH);

  // 배경 — 잡몹들이 아래에서 어슬렁거린다
  for (let i = 0; i < 7; i += 1) {
    const kx = ['boyz', 'demonz', 'machinz'][i % 3];
    const px = 60 + i * 96 + Math.sin(t * 0.6 + i) * 22;
    ctx.save();
    ctx.globalAlpha = 0.30;
    drawCharacter(ctx, {
      kind: kx, x: px, y: 1180 + (i % 3) * 26, size: 44, seed: i * 17 + 3, facing: 1,
      pose: { walk: t * 2 + i, moving: true, lean: 0, state: null, prog: 0 },
    });
    ctx.restore();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 104px system-ui, sans-serif';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 20;
  ctx.strokeText('GUN', b.designW / 2, 250);
  ctx.strokeText('DUDE', b.designW / 2, 352);
  ctx.fillStyle = PALETTE.parchment;
  ctx.fillText('GUN', b.designW / 2, 250);
  ctx.fillText('DUDE', b.designW / 2, 352);

  // 부제는 제목 아래로 충분히 띄운다. 104px 글자의 아랫단이 여기까지 내려온다.
  ctx.font = 'bold 24px system-ui, sans-serif';
  ctx.fillStyle = '#9FB4C4';
  ctx.fillText('절벽 위에서 얼마나 버티나', b.designW / 2, 430);

  // 총을 수평으로 들면 얼굴을 가로지른다. 타이틀에서는 총구를 살짝 내린다.
  drawCharacter(ctx, {
    kind: 'dude', x: b.designW / 2, y: 690, size: 130, seed: 1337, facing: 1,
    aimA: 0.30,
    pose: { walk: 0, moving: false, lean: 0, state: null, prog: 0 },
  });

  if (state.best > 0) {
    panel(ctx, b.designW / 2 - 150, 716, 300, 58, PALETTE.parchment, 4, 29);
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillText(`최고 기록  ${formatTime(state.best)}`, b.designW / 2, 746);
  }

  const pulse = 1 + Math.sin(t * 3.2) * 0.014;
  ctx.save();
  ctx.translate(L.start.x + L.start.w / 2, L.start.y + L.start.h / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-(L.start.x + L.start.w / 2), -(L.start.y + L.start.h / 2));
  panel(ctx, L.start.x, L.start.y, L.start.w, L.start.h, PALETTE.hpRed, 7, 24);
  ctx.font = 'bold 52px system-ui, sans-serif';
  outlinedText(ctx, '시작', L.start.x + L.start.w / 2, L.start.y + L.start.h / 2 + 2, 8);
  ctx.restore();

  panel(ctx, L.lobby.x, L.lobby.y, L.lobby.w, L.lobby.h, PALETTE.parchment, 5, 20);
  // 글자와 재화가 겹치던 자리다. 폭을 재서 배치한다 —
  // 고정 오프셋으로 두면 숫자가 커지는 순간 무너진다.
  const cy = L.lobby.y + L.lobby.h / 2 + 1;
  const label = '유전자 조작';
  const amount = `${state.bio}`;
  ctx.font = 'bold 32px system-ui, sans-serif';
  const lw = ctx.measureText(label).width;
  ctx.font = 'bold 26px system-ui, sans-serif';
  const aw = ctx.measureText(amount).width;
  const GAP = 22, ICON = 26;
  const total = lw + GAP + ICON + 8 + aw;
  const x0 = b.designW / 2 - total / 2;

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 32px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(label, x0, cy);
  bioIcon(ctx, x0 + lw + GAP + ICON / 2, cy - 1, ICON);
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillStyle = '#3F6B86';
  ctx.fillText(amount, x0 + lw + GAP + ICON + 8, cy);
  ctx.textAlign = 'center';
}

/* ============================================================ 로비 — 유전자 트리 */

/**
 * 【v3 — 시안 준수】 `Mutation UI 0.png` 를 그대로 따랐다.
 *
 * 이전 화면의 문제는 셋이었다:
 *  1. 노드가 전부 밝고 전부 글로우가 있었다 → **상태가 안 읽힌다**
 *  2. 노드가 색 원뿐이라 무엇을 하는 노드인지 눌러 봐야 알았다 → **픽토그램**
 *  3. 노드가 붙어 있어 손가락으로 고르기 어려웠다 → **간격 78px · 패닝**
 *
 * 시안이 정한 규칙:
 *  - 배경은 펼친 **양피지 책**이다. 네이비 단색이 아니다
 *  - 못 배운 노드는 **회색**이다. 배운 노드만 색을 가진다
 *  - 선택 표시는 글로우가 아니라 **네 모서리 대괄호**다
 *  - 배선은 굵은 검정선이고 모서리가 **둥글게** 휜다
 */

const CELL = 78;
const NODE_R = 22;          // 스탯 노드
const BIG_R = 31;           // 기능 해금 노드

/** 트리를 보여 주는 창. 이 밖으로는 안 그린다. */
function treeViewport(b = B) {
  return { x: 22, y: 232, w: b.designW - 44, h: 424 };
}

/** 격자 좌표 → 트리 내부 좌표 (패닝 전). */
function nodePos(n) {
  return { x: n.g[0] * CELL, y: n.g[1] * CELL };
}

/** 패닝을 적용한 화면 좌표. */
function screenPos(n, pan, b = B) {
  const V = treeViewport(b);
  const p = nodePos(n);
  return { x: V.x + V.w / 2 + p.x + pan.x, y: V.y + V.h / 2 + p.y + pan.y };
}

/** 패닝 한계 — 트리가 창 밖으로 완전히 사라지지 않게 묶는다. */
function clampPan(pan, b = B) {
  const V = treeViewport(b);
  const lim = 4 * CELL + 40;
  const mx = Math.max(0, lim - V.w / 2 + 60);
  const my = Math.max(0, lim - V.h / 2 + 60);
  return {
    x: Math.max(-mx, Math.min(mx, pan.x)),
    y: Math.max(-my, Math.min(my, pan.y)),
  };
}

function lobbyLayout(b = B) {
  return {
    record: { x: 22, y: 22, w: b.designW - 44, h: 126 },
    // 능력·옵션은 기록 카드 **아래**에 둔다 (디렉터 지시).
    // 위에 겹쳐 두면 기록을 가리고, 무엇이 상위 정보인지도 흐려진다.
    totals:  { x: 22, y: 158, w: 214, h: 60 },
    options: { x: 244, y: 158, w: 116, h: 60 },
    purse:   { x: 372, y: 158, w: b.designW - 394, h: 60 },
    panel:   { x: 22, y: 668, w: b.designW - 44, h: 424 },
    learn:   { x: 46, y: 1000, w: b.designW - 92, h: 78 },
    start:   { x: 34, y: b.designH - 106, w: b.designW - 68, h: 84 },
    close:   { x: b.designW - 88, y: 24, w: 64, h: 64 },
    reset:   { x: 70, y: 520, w: b.designW - 140, h: 86 },
    confirm: { x: 70, y: 640, w: b.designW - 140, h: 78 },
  };
}

/**
 * 탭 판정.
 * @param view 'tree' | 'totals' | 'options'
 */
function lobbyHitTest(x, y, owned, selected, view = 'tree', pan = { x: 0, y: 0 }, b = B) {
  const L = lobbyLayout(b);
  if (view === 'totals' || view === 'options') {
    if (inside(L.close, x, y)) return { type: 'closeOverlay' };
    if (view === 'options') {
      if (inside(L.reset, x, y)) return { type: 'resetAsk' };
      if (inside(L.confirm, x, y)) return { type: 'resetDo' };
    }
    return { type: 'none' };
  }
  if (inside(L.totals, x, y)) return { type: 'totals' };
  if (inside(L.options, x, y)) return { type: 'options' };
  if (inside(L.start, x, y)) return { type: 'start' };
  if (selected && inside(L.learn, x, y)) return { type: 'learn', id: selected };

  // 노드는 창 안에 보이는 것만 잡힌다
  const V = treeViewport(b);
  if (x >= V.x && x <= V.x + V.w && y >= V.y && y <= V.y + V.h) {
    let best = null, bestD = 40 * 40;
    for (const n of revealedNodes(owned)) {
      const p = screenPos(n, pan, b);
      const d = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d < bestD) { bestD = d; best = n.id; }
    }
    if (best) return { type: 'select', id: best };
    return { type: 'deselect' };
  }
  return { type: 'none' };
}

/**
 * 배선 — 시안은 직각이 아니라 **둥글게 휜다.**
 * 꺾이는 자리에 곡선을 넣으면 손그림 느낌이 살고, 길이 눈으로 따라진다.
 */
function wire(ctx, a, c, on) {
  const midX = Math.abs(c.x - a.x) > Math.abs(c.y - a.y);
  const corner = midX ? { x: c.x, y: a.y } : { x: a.x, y: c.y };
  const r = 22;
  const d1 = Math.hypot(corner.x - a.x, corner.y - a.y);
  const d2 = Math.hypot(c.x - corner.x, c.y - corner.y);

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  // 검정 외곽 → 안쪽 색. 시안의 굵은 먹선을 흉내낸다.
  for (const [w, col] of [[13, PALETTE.ink], [7, on ? '#F0C64A' : '#B8AB92']]) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    if (d1 > r && d2 > r) {
      const t1 = { x: a.x + ((corner.x - a.x) / d1) * (d1 - r), y: a.y + ((corner.y - a.y) / d1) * (d1 - r) };
      const t2 = { x: corner.x + ((c.x - corner.x) / d2) * r, y: corner.y + ((c.y - corner.y) / d2) * r };
      ctx.lineTo(t1.x, t1.y);
      ctx.quadraticCurveTo(corner.x, corner.y, t2.x, t2.y);
    } else {
      ctx.lineTo(corner.x, corner.y);
    }
    ctx.lineTo(c.x, c.y);
    ctx.stroke();
  }
  ctx.restore();
}

/**
 * 노드 하나. 상태는 셋뿐이다 — 디렉터가 정리해 준 그대로다.
 *   잠김/미학습 → 회색 딤
 *   배우는 중   → 갈래색 + 진행 호
 *   가득 참     → 갈래색 + 금 테두리
 * 글로우는 쓰지 않는다. 전부 빛나면 아무것도 안 빛나는 것과 같다.
 */
function drawNode(ctx, n, p, level, afford, isSel) {
  const col = n.branch ? BRANCH[n.branch].color : '#F0C64A';
  const big = n.kind === 'unlock';
  const r = big ? BIG_R : NODE_R;
  const maxed = level >= n.max;
  const learning = level > 0 && !maxed;

  const face = level > 0 ? col : '#A79C8C';
  const ink = level > 0 ? '#FFFFFF' : '#6E6558';

  ctx.save();
  // 바닥 그림자 — 종이 위에 놓인 칩처럼 보이게
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(p.x, p.y + 3, r, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
  ctx.fillStyle = face; ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = big ? 5 : 4;
  ctx.stroke();

  drawIcon(ctx, iconForNode(n), p.x, p.y, r * (big ? 0.56 : 0.52), ink);

  // 배우는 중 — 몇 단계까지 왔는지 테두리 호로
  if (learning && n.max > 1) {
    ctx.save();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r - 3.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (level / n.max));
    ctx.stroke();
    ctx.restore();
  }
  // 가득 참 — 금 테두리
  if (maxed) {
    ctx.save();
    ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 5, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(p.x, p.y, r + 7.3, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  // 살 수 있음 — 조용한 금색 점 하나. 글로우로 화면을 덮지 않는다.
  if (afford) {
    const ax = p.x + r * 0.72, ay = p.y - r * 0.72;
    ctx.beginPath(); ctx.arc(ax, ay, 7, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE.gold; ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();
  }
  // 선택 — 시안의 네 모서리 대괄호
  if (isSel) {
    const d = r + 13, len = 11;
    ctx.save();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (const [sx, sy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
      ctx.beginPath();
      ctx.moveTo(p.x + sx * d, p.y + sy * d - sy * len);
      ctx.lineTo(p.x + sx * d, p.y + sy * d);
      ctx.lineTo(p.x + sx * d - sx * len, p.y + sy * d);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/** 펼친 책 — 시안의 배경. 트리는 이 종이 위에 그려진다. */
function paperPage(ctx, V) {
  ctx.save();
  ctx.fillStyle = '#4A3527';
  ctx.beginPath(); ctx.roundRect(V.x - 7, V.y - 7, V.w + 14, V.h + 14, 16); ctx.fill();
  const g = ctx.createLinearGradient(V.x, V.y, V.x, V.y + V.h);
  g.addColorStop(0, '#F2E8D2');
  g.addColorStop(0.5, '#EADFC4');
  g.addColorStop(1, '#E0D3B4');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(V.x, V.y, V.w, V.h, 11); ctx.fill();
  // 가운데 접힌 자국
  ctx.globalAlpha = 0.16;
  const f = ctx.createLinearGradient(V.x + V.w / 2 - 22, 0, V.x + V.w / 2 + 22, 0);
  f.addColorStop(0, 'rgba(0,0,0,0)');
  f.addColorStop(0.5, 'rgba(74,53,39,1)');
  f.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = f;
  ctx.fillRect(V.x + V.w / 2 - 22, V.y, 44, V.h);
  ctx.restore();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.roundRect(V.x, V.y, V.w, V.h, 11); ctx.stroke();
}

/** 작은 아이콘 버튼 — 능력 / 옵션 */
function iconButton(ctx, r, label, badge, drawGlyph) {
  ctx.save();
  ctx.fillStyle = PALETTE.parchment;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 16); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 16); ctx.stroke();
  drawGlyph(ctx, r.x + 34, r.y + r.h / 2);
  if (label) {
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillText(label, r.x + 58, r.y + r.h / 2 + 1);
  }
  if (badge > 0) {
    ctx.fillStyle = PALETTE.hpRed;
    ctx.beginPath(); ctx.arc(r.x + r.w - 6, r.y + 6, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 15px system-ui, sans-serif';
    outlinedText(ctx, `${badge}`, r.x + r.w - 6, r.y + 7, 4);
  }
  ctx.restore();
}

/* -------------------------------------------------- 능력 총합 화면 */

function overlayClose(ctx, L) {
  ctx.save();
  ctx.fillStyle = PALETTE.parchment;
  ctx.beginPath(); ctx.roundRect(L.close.x, L.close.y, L.close.w, L.close.h, 18); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(L.close.x, L.close.y, L.close.w, L.close.h, 18); ctx.stroke();
  ctx.strokeStyle = PALETTE.woodDark; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const cx = L.close.x + L.close.w / 2, cy = L.close.y + L.close.h / 2;
  ctx.beginPath();
  ctx.moveTo(cx - 13, cy - 13); ctx.lineTo(cx + 13, cy + 13);
  ctx.moveTo(cx + 13, cy - 13); ctx.lineTo(cx - 13, cy + 13);
  ctx.stroke();
  ctx.restore();
}

/**
 * "지금까지 뭘 얻었지" 에 한 화면으로 답한다.
 * 기본값을 나란히 놓지 않으면 숫자가 큰지 작은지 알 수가 없다.
 */
function renderTotals(ctx, state, t, b = B) {
  const { owned, bio } = state;
  const L = lobbyLayout(b);
  const sum = statSummary(owned, b);

  ctx.fillStyle = 'rgba(12,24,34,0.96)';
  ctx.fillRect(0, 0, b.designW, b.designH);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px system-ui, sans-serif';
  outlinedText(ctx, '얻은 능력', b.designW / 2, 56, 8);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = '#9FB4C4';
  ctx.fillText(`유전자 ${sum.learned}단계 습득 · 보유 조각 ${bio}`, b.designW / 2, 90);
  overlayClose(ctx, L);

  let y = 120;
  if (sum.unlocks.length > 0) {
    const h = 34 + sum.unlocks.length * 34;
    panel(ctx, 24, y, b.designW - 48, h, '#FFFDF6', 5, 18);
    ctx.textAlign = 'left';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillText('해금한 능력', 46, y + 22);
    sum.unlocks.forEach((u, i) => {
      const ly = y + 50 + i * 34;
      const node = NODES.find((n) => n.name === u.name);
      ctx.fillStyle = BRANCH[u.branch].color;
      ctx.beginPath(); ctx.arc(60, ly - 4, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();
      drawIcon(ctx, iconForNode(node), 60, ly - 4, 8, '#FFFFFF');
      ctx.font = 'bold 17px system-ui, sans-serif';
      ctx.fillStyle = PALETTE.woodDark;
      ctx.fillText(u.name, 84, ly - 4);
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = '#9C8B6E';
      ctx.fillText(u.unit, 84 + ctx.measureText(u.name).width + 26, ly - 3);
    });
    y += h + 12;
  } else {
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = '#7C8B96';
    ctx.fillText('아직 해금한 능력이 없다 — 갈래 끝의 큰 노드가 해금이다', b.designW / 2, y + 14);
    y += 40;
  }

  const rowH = 31;
  const h2 = 34 + sum.rows.length * rowH + 10;
  panel(ctx, 24, y, b.designW - 48, h2, '#FFFDF6', 5, 18);
  ctx.textAlign = 'left';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText('수치', 46, y + 22);
  ctx.textAlign = 'right';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillStyle = '#B7ADA0';
  ctx.fillText('기본', b.designW - 168, y + 22);
  ctx.fillText('지금', b.designW - 46, y + 22);

  sum.rows.forEach((r, i) => {
    const ly = y + 50 + i * rowH;
    ctx.textAlign = 'left';
    ctx.fillStyle = BRANCH[r.branch].color;
    ctx.beginPath(); ctx.arc(52, ly, 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = r.changed ? 'bold 16px system-ui, sans-serif' : '16px system-ui, sans-serif';
    ctx.fillStyle = r.changed ? PALETTE.woodDark : '#A79C8C';
    ctx.fillText(r.label, 66, ly);
    ctx.textAlign = 'right';
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = '#B7ADA0';
    ctx.fillText(r.base, b.designW - 168, ly);
    ctx.font = r.changed ? 'bold 19px system-ui, sans-serif' : '16px system-ui, sans-serif';
    ctx.fillStyle = r.changed ? '#1E7A3C' : '#A79C8C';
    ctx.fillText(r.now, b.designW - 46, ly);
  });
}

/* -------------------------------------------------------- 옵션 화면 */

/**
 * 옵션. 지금은 개발용 초기화만 있고, 사운드는 자리만 잡아 둔다.
 * 초기화는 되돌릴 수 없으므로 **두 번 눌러야** 실행된다.
 */
function renderOptions(ctx, state, t, b = B) {
  const { askingReset, bio, learned } = state;
  const L = lobbyLayout(b);

  ctx.fillStyle = 'rgba(12,24,34,0.96)';
  ctx.fillRect(0, 0, b.designW, b.designH);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 36px system-ui, sans-serif';
  outlinedText(ctx, '옵션', b.designW / 2, 56, 8);
  overlayClose(ctx, L);

  // 사운드 — 아직 없다. 없다는 걸 숨기지 않는다.
  panel(ctx, 40, 130, b.designW - 80, 96, 'rgba(255,255,255,0.06)', 4, 18);
  ctx.textAlign = 'left';
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillStyle = '#7C8B96';
  ctx.fillText('사운드', 70, 168);
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText('아직 없다 — 붙이면 여기에 생긴다', 70, 196);

  // 현재 세이브
  panel(ctx, 40, 246, b.designW - 80, 130, '#FFFDF6', 5, 18);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText('지금 저장되어 있는 것', 70, 282);
  ctx.font = '17px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText(`유전자 ${learned}단계 · 보유 조각 ${bio}`, 70, 316);
  ctx.fillText('최고 기록 · 총 시도 횟수', 70, 348);

  ctx.textAlign = 'center';
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = '#9FB4C4';
  ctx.fillText('개발용', b.designW / 2, 456);

  const R = L.reset;
  panel(ctx, R.x, R.y, R.w, R.h, askingReset ? '#8E3A34' : PALETTE.parchment, 6, 20);
  ctx.font = 'bold 27px system-ui, sans-serif';
  if (askingReset) {
    outlinedText(ctx, '정말 지울까?', R.x + R.w / 2, R.y + 32, 7);
    ctx.font = 'bold 15px system-ui, sans-serif';
    outlinedText(ctx, '유전자·조각·기록이 전부 사라진다', R.x + R.w / 2, R.y + 62, 5);
  } else {
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillText('데이터 초기화', R.x + R.w / 2, R.y + R.h / 2 + 1);
  }

  if (askingReset) {
    const C = L.confirm;
    panel(ctx, C.x, C.y, C.w, C.h, PALETTE.hpRed, 6, 20);
    ctx.font = 'bold 28px system-ui, sans-serif';
    outlinedText(ctx, '지운다', C.x + C.w / 2, C.y + C.h / 2 + 1, 7);
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = '#9FB4C4';
    ctx.fillText('취소하려면 X 를 눌러라', b.designW / 2, C.y + C.h + 34);
  }
}

/* -------------------------------------------------------- 로비 본체 */

function renderLobby(ctx, state, t, b = B) {
  const {
    bio, owned: rawOwned, best, lastRun, lastBio, lastLost, lastWave, lastStage,
    selected, pan = { x: 0, y: 0 },
  } = state;
  const owned = normalizeOwned(rawOwned);
  const L = lobbyLayout(b);
  const V = treeViewport(b);

  ctx.fillStyle = PALETTE.backdrop;
  ctx.fillRect(0, 0, b.designW, b.designH);

  /* --- 지난 판의 결과 --- */
  const R = L.record;
  panel(ctx, R.x, R.y, R.w, R.h, PALETTE.parchment, 5);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 21px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText('쓰러졌다', b.designW / 2, R.y + 26);
  ctx.font = 'bold 52px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(formatTime(lastRun), b.designW / 2, R.y + 66);
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText(`스테이지 ${lastStage} · 웨이브 ${lastWave}   ·   최고 ${formatTime(best)}`,
    b.designW / 2, R.y + 104);

  /* --- 능력 · 옵션 · 지갑 --- */
  const sum = statSummary(owned, b);
  iconButton(ctx, L.totals, '얻은 능력', sum.learned, (c, gx, gy) => {
    c.fillStyle = PALETTE.woodDark;
    for (let i = 0; i < 3; i += 1) {
      c.beginPath(); c.roundRect(gx - 15, gy - 11 + i * 10, 30 - i * 7, 6, 3); c.fill();
    }
  });
  iconButton(ctx, L.options, null, 0, (c, gx, gy) => {
    // 톱니
    c.save();
    c.translate(gx + 6, gy);
    c.fillStyle = PALETTE.woodDark;
    for (let i = 0; i < 8; i += 1) {
      c.save(); c.rotate((i / 8) * Math.PI * 2);
      c.beginPath(); c.roundRect(-4, -18, 8, 8, 2); c.fill();
      c.restore();
    }
    c.beginPath(); c.arc(0, 0, 12, 0, Math.PI * 2); c.fill();
    c.globalCompositeOperation = 'destination-out';
    c.beginPath(); c.arc(0, 0, 5, 0, Math.PI * 2); c.fill();
    c.restore();
  });

  const P = L.purse;
  ctx.save();
  ctx.fillStyle = '#FFFFFF';
  ctx.beginPath(); ctx.roundRect(P.x, P.y, P.w, P.h, 16); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(P.x, P.y, P.w, P.h, 16); ctx.stroke();
  ctx.restore();
  bioIcon(ctx, P.x + 26, P.y + P.h / 2, 26);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(`${bio}`, P.x + 46, P.y + P.h / 2 + 1);
  if (lastBio > 0) {
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = '#1E7A3C';
    ctx.textAlign = 'right';
    ctx.fillText(`+${lastBio}`, P.x + P.w - 14, P.y + 20);
  }
  if (lastLost > 0) {
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillStyle = '#B03A3A';
    ctx.textAlign = 'right';
    ctx.fillText(`못 주움 −${lastLost}`, P.x + P.w - 14, P.y + 42);
  }

  /* --- 트리 (양피지 위, 창 안으로 잘린다) --- */
  paperPage(ctx, V);
  ctx.save();
  ctx.beginPath(); ctx.roundRect(V.x, V.y, V.w, V.h, 11); ctx.clip();

  const vis = revealedNodes(owned);
  const visIds = new Set(vis.map((n) => n.id));
  for (const n of vis) {
    if (!n.req) continue;
    wire(ctx, screenPos(NODE_BY_ID[n.req], pan, b), screenPos(n, pan, b), (owned[n.id] ?? 0) > 0);
  }
  // 아직 안 드러난 앞길은 짧은 토막으로만 알린다 — 무엇인지는 안 알린다
  for (const n of vis) {
    if ((owned[n.id] ?? 0) <= 0) continue;
    for (const c of NODES) {
      if (c.req !== n.id || visIds.has(c.id)) continue;
      const a = screenPos(n, pan, b), z = screenPos(c, pan, b);
      const d = Math.hypot(z.x - a.x, z.y - a.y) || 1;
      ctx.save();
      ctx.globalAlpha = 0.45;
      ctx.strokeStyle = '#8B7E66'; ctx.lineWidth = 8;
      ctx.lineCap = 'round';
      ctx.setLineDash([6, 10]);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + ((z.x - a.x) / d) * 46, a.y + ((z.y - a.y) / d) * 46);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
  }
  for (const n of vis) {
    const lv = owned[n.id] ?? 0;
    const afford = canLearn(n.id, owned) && bio >= nextCost(n.id, owned);
    drawNode(ctx, n, screenPos(n, pan, b), lv, afford, selected === n.id);
  }
  ctx.restore();

  // 끌 수 있다는 힌트
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = '#7C8B96';
  ctx.fillText('끌어서 움직이고, 노드를 눌러 살펴본다', b.designW / 2, V.y + V.h + 16);

  /* --- 정보창 --- */
  const n = selected ? NODE_BY_ID[selected] : null;
  if (!n) {
    panel(ctx, L.panel.x, L.panel.y, L.panel.w, 128, 'rgba(255,255,255,0.06)', 4, 20);
    ctx.font = 'bold 21px system-ui, sans-serif';
    ctx.fillStyle = '#8FA6B6';
    ctx.fillText('노드를 하나 골라 보라', b.designW / 2, L.panel.y + 52);
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillStyle = '#7C8B96';
    ctx.fillText('배운 노드의 다음 길만 드러난다', b.designW / 2, L.panel.y + 84);
  } else {
    drawNodeCard(ctx, n, owned, bio, L, b);
  }

  /* --- 다시 도전 --- */
  const s2 = L.start;
  const pulse = 1 + Math.sin(t * 3.4) * 0.012;
  ctx.save();
  ctx.translate(s2.x + s2.w / 2, s2.y + s2.h / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-(s2.x + s2.w / 2), -(s2.y + s2.h / 2));
  panel(ctx, s2.x, s2.y, s2.w, s2.h, PALETTE.hpRed, 6, 20);
  ctx.textAlign = 'center';
  ctx.font = 'bold 34px system-ui, sans-serif';
  outlinedText(ctx, '다시 도전', s2.x + s2.w / 2, s2.y + s2.h / 2 + 2, 7);
  ctx.restore();
}

/**
 * 노드 정보창.
 *
 * 【위계】 글자 크기가 곧 중요도다. 다 같은 크기면 아무것도 안 읽힌다.
 *   1순위 — 이름(36) 과 **효과(28)**. 이게 결정에 쓰이는 정보다
 *   2순위 — 단계 표시. 그림(칸)이 숫자보다 빨리 읽힌다
 *   3순위 — 왜 배우는가(18). 읽고 싶은 사람만 읽는다
 *   4순위 — 갈래 이름(15). 색으로 이미 알 수 있다
 */
function drawNodeCard(ctx, n, owned, bio, L, b) {
  const col = n.branch ? BRANCH[n.branch].color : '#F0C64A';
  const lv = owned[n.id] ?? 0;
  const maxed = lv >= n.max;
  const cost = nextCost(n.id, owned);
  const afford = !maxed && bio >= cost;
  const P = L.panel;
  const big = n.kind === 'unlock';

  panel(ctx, P.x, P.y, P.w, P.h, PALETTE.parchment, 6, 22);
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.roundRect(P.x + 6, P.y + 14, 11, P.h - 28, 6); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();

  // 아이콘 — 트리에서 본 그 그림 그대로. 어느 노드를 보고 있는지 이어져야 한다.
  const ix = P.x + 68, iy = P.y + 62;
  ctx.beginPath(); ctx.arc(ix, iy, 36, 0, Math.PI * 2);
  ctx.fillStyle = lv > 0 ? col : '#A79C8C'; ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 5; ctx.stroke();
  drawIcon(ctx, iconForNode(n), ix, iy, 20, lv > 0 ? '#FFFFFF' : '#6E6558');

  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#9C8B6E';
  const branchName = n.branch ? BRANCH[n.branch].name : '시작점';
  ctx.fillText(branchName, ix + 52, P.y + 34);
  if (big && n.id !== 'root') {
    const bw = 78;
    const bx = ix + 52 + ctx.measureText(branchName).width + 12;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(bx, P.y + 23, bw, 23, 11); ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = 'bold 13px system-ui, sans-serif';
    outlinedText(ctx, '기능 해금', bx + bw / 2, P.y + 35, 4);
    ctx.textAlign = 'left';
  }

  // 1순위 — 이름
  ctx.font = 'bold 36px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(n.name, ix + 52, P.y + 72);

  // 2순위 — 단계
  if (n.max > 1) {
    levelPips(ctx, ix + 52, P.y + 108, lv, n.max, col, 18, 7);
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillStyle = '#8A7355';
    ctx.fillText(`${lv} / ${n.max}`, ix + 52 + n.max * 25 + 12, P.y + 108);
  } else {
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillStyle = lv > 0 ? '#1E7A3C' : '#8A7355';
    ctx.fillText(lv > 0 ? '해금됨' : '아직 해금하지 않음', ix + 52, P.y + 106);
  }

  // 1순위 — 효과. 이 화면에서 가장 크게 읽혀야 하는 줄이다.
  const eh = 84;
  panel(ctx, P.x + 22, P.y + 134, P.w - 44, eh, '#FFFDF6', 4, 14);
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#B0A288';
  ctx.fillText(n.max > 1 ? '한 단계당' : '효과', P.x + 42, P.y + 156);
  ctx.font = 'bold 28px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(n.unit ?? n.desc ?? '—', P.x + 42, P.y + 188);
  if (n.max > 1 && lv > 0) {
    ctx.textAlign = 'right';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = '#1E7A3C';
    ctx.fillText(`${lv}단계 적용 중`, P.x + P.w - 42, P.y + 188);
    ctx.textAlign = 'left';
  }

  // 3순위 — 왜 배우는가
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  wrapText(ctx, n.long ?? n.desc ?? '', P.x + 26, P.y + 250, P.w - 52, 27, 4);

  // 배우기
  const Lb = L.learn;
  const fill = maxed ? '#C8BFAE' : (afford ? '#2E9E52' : '#B8AE9C');
  panel(ctx, Lb.x, Lb.y, Lb.w, Lb.h, fill, 6, 20);
  ctx.textAlign = 'center';
  if (maxed) {
    ctx.font = 'bold 26px system-ui, sans-serif';
    ctx.fillStyle = '#6E6355';
    ctx.fillText('더 올릴 것이 없다', Lb.x + Lb.w / 2, Lb.y + Lb.h / 2 + 1);
  } else {
    const label = lv > 0 ? `${lv + 1}단계로` : '배우기';
    ctx.font = 'bold 28px system-ui, sans-serif';
    const lw = ctx.measureText(label).width;
    ctx.font = 'bold 27px system-ui, sans-serif';
    const cw = ctx.measureText(`${cost}`).width;
    const total = lw + 34 + cw + 26;
    const x0 = Lb.x + Lb.w / 2 - total / 2;
    ctx.textAlign = 'left';
    ctx.font = 'bold 28px system-ui, sans-serif';
    outlinedText(ctx, label, x0, Lb.y + Lb.h / 2 - (afford ? 0 : 8), 6);
    bioIcon(ctx, x0 + lw + 26, Lb.y + Lb.h / 2 - (afford ? 1 : 9), 26);
    ctx.font = 'bold 27px system-ui, sans-serif';
    outlinedText(ctx, `${cost}`, x0 + lw + 44, Lb.y + Lb.h / 2 - (afford ? 0 : 8), 6);
    if (!afford) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 15px system-ui, sans-serif';
      ctx.fillStyle = '#6B3A34';
      ctx.fillText(`${cost - bio} 더 모아야 한다`, Lb.x + Lb.w / 2, Lb.y + Lb.h - 15);
    }
  }
}

/** 단계 표시 — 숫자보다 칸이 먼저 읽힌다. */
function levelPips(ctx, x, y, level, max, color, size = 18, gap = 7) {
  for (let i = 0; i < max; i += 1) {
    ctx.beginPath();
    ctx.roundRect(x + i * (size + gap), y - size / 2, size, size, 5);
    ctx.fillStyle = i < level ? color : 'rgba(0,0,0,0.13)';
    ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5;
    ctx.stroke();
  }
}

/** 줄바꿈 — 캔버스에는 자동 줄바꿈이 없다. */
function wrapText(ctx, text, x, y, maxW, lineH, maxLines) {
  const words = String(text).split(' ');
  let line = '';
  let n = 0;
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y + n * lineH);
      n += 1;
      if (n >= maxLines) return;
      line = w;
    } else line = test;
  }
  if (line && n < maxLines) ctx.fillText(line, x, y + n * lineH);
}


/* ============================================================ 상점 (보스 후) */

const CARD_H = 150;
const CARD_TOP = 250;

function shopLayout(options, b = B) {
  return {
    cards: options.map((o, i) => ({
      i, x: 30, y: CARD_TOP + i * (CARD_H + 14), w: b.designW - 60, h: CARD_H,
    })),
    skip: { x: 30, y: b.designH - 118, w: b.designW - 60, h: 86 },
  };
}

function shopHitTest(x, y, options, b = B) {
  const L = shopLayout(options, b);
  if (inside(L.skip, x, y)) return { type: 'skip' };
  for (const c of L.cards) if (inside(c, x, y)) return { type: 'buy', index: c.i };
  return { type: 'none' };
}

const OPT_TINT = {
  weapon: '#4E8FBF',
  heal:   '#4FA96B',
  maxhp:  '#E08A3C',
  power:  '#D9534F',
};

/** 상품 그림 — 글자보다 그림이 먼저 읽힌다. 무기는 실루엣 그대로 보여준다. */
function optionIcon(ctx, o, cx, cy, r) {
  ctx.save();
  // 둥근 받침
  ctx.fillStyle = '#FFF6E3';
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.stroke();
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r - 2, 0, Math.PI * 2); ctx.clip();

  if (o.type === 'weapon') {
    drawGun(ctx, cx - r * 0.42, cy + r * 0.06, r * 1.75, 1, 7, 3.2, weaponById(o.id).shape);
  } else if (o.type === 'heal') {
    const s2 = r * 0.52;
    ctx.fillStyle = '#4FA96B'; ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.roundRect(cx - s2 * 0.32, cy - s2, s2 * 0.64, s2 * 2, 5);
    ctx.roundRect(cx - s2, cy - s2 * 0.32, s2 * 2, s2 * 0.64, 5);
    ctx.fill(); ctx.stroke();
  } else if (o.type === 'maxhp') {
    // 하트 — 최대 체력이 늘어난다
    const s2 = r * 0.62;
    ctx.fillStyle = '#E0604F'; ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3.4;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s2 * 0.85);
    ctx.bezierCurveTo(cx - s2 * 1.5, cy - s2 * 0.25, cx - s2 * 0.5, cy - s2 * 1.15, cx, cy - s2 * 0.35);
    ctx.bezierCurveTo(cx + s2 * 0.5, cy - s2 * 1.15, cx + s2 * 1.5, cy - s2 * 0.25, cx, cy + s2 * 0.85);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.font = `bold ${Math.round(r * 0.5)}px system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+', cx, cy - s2 * 0.05);
  } else {
    // 탄약 — 피해가 오른다
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3.2;
    for (const off of [-r * 0.36, 0, r * 0.36]) {
      ctx.fillStyle = PALETTE.goldDark;
      ctx.beginPath();
      ctx.roundRect(cx + off - r * 0.13, cy - r * 0.10, r * 0.26, r * 0.62, 3);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#C46B3A';
      ctx.beginPath();
      ctx.moveTo(cx + off - r * 0.13, cy - r * 0.10);
      ctx.lineTo(cx + off, cy - r * 0.62);
      ctx.lineTo(cx + off + r * 0.13, cy - r * 0.10);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  ctx.restore();
  ctx.restore();
}

/** 가격표 — 캐주얼 게임의 말뚝 가격표처럼 카드 밖으로 살짝 걸친다. */
function priceTag(ctx, x, y, price, afford, sold) {
  const digits = String(price).length;
  const w = sold ? 92 : 66 + digits * 15, h = 40;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.05);
  ctx.fillStyle = sold ? '#B7ADA0' : (afford ? '#2E9E52' : '#C2554E');
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 12); ctx.fill();
  ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 12); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (sold) {
    ctx.font = 'bold 20px system-ui, sans-serif';
    outlinedText(ctx, '구매함', 0, 1, 5);
  } else {
    ctx.font = 'bold 24px system-ui, sans-serif';
    outlinedText(ctx, `${price}`, w / 2 - 10 - ctx.measureText(`${price}`).width / 2, 1, 5);
    drawGold(ctx, -w / 2 + 20, 0, 22, 3);
  }
  ctx.restore();
}

/**
 * 보스를 잡아야 열리는 상점. 돈(금색)으로 산다.
 *
 * 한 번 사면 닫히던 것을 고쳤다. 돈이 남았는데 화면이 닫히면
 * "무엇을 살까" 가 아니라 "무엇을 포기할까" 가 되어 선택이 즐겁지 않다.
 * 이제 살 수 있는 만큼 사고, 직접 나가기를 눌러 진행한다.
 */
function renderShop(ctx, state, t, b = B) {
  const { options, money, stage, currentWeapon, hp, maxHp } = state;
  const L = shopLayout(options, b);
  const cur = weaponById(currentWeapon);
  const boughtAny = options.some((o) => o.bought);

  ctx.fillStyle = 'rgba(16,30,42,0.975)';
  ctx.fillRect(0, 0, b.designW, b.designH);

  // 천막 — 캐주얼 상점의 신호
  ctx.save();
  const tw = b.designW / 9;
  for (let i = 0; i < 9; i += 1) {
    ctx.fillStyle = i % 2 ? '#E0604F' : '#F4EFE2';
    ctx.beginPath();
    ctx.moveTo(i * tw, 0);
    ctx.lineTo((i + 1) * tw, 0);
    ctx.lineTo((i + 1) * tw, 22);
    ctx.quadraticCurveTo(i * tw + tw / 2, 44, i * tw, 22);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 38px system-ui, sans-serif';
  outlinedText(ctx, `스테이지 ${stage} 보급소`, b.designW / 2, 78, 8);

  panel(ctx, 30, 112, b.designW - 60, 116, PALETTE.parchment, 5, 22);
  optionIcon(ctx, { type: 'weapon', id: currentWeapon }, 82, 170, 40);
  ctx.textAlign = 'left';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText('지금 든 총', 134, 146);
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(cur.name, 134, 174);
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText(`체력  ${Math.ceil(hp)} / ${maxHp}`, 134, 200);

  ctx.textAlign = 'right';
  ctx.font = 'bold 38px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(`${money}`, b.designW - 56, 160);
  drawGold(ctx, b.designW - 76 - ctx.measureText(`${money}`).width, 158, 28, 3);
  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText('보유 자금', b.designW - 56, 188);

  for (const c of L.cards) {
    const o = options[c.i];
    const sold = !!o.bought;
    const afford = !sold && money >= o.price;

    // 그림자 — 카드가 떠 있는 느낌
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.roundRect(c.x + 5, c.y + 7, c.w, c.h, 22); ctx.fill();
    ctx.restore();

    panel(ctx, c.x, c.y, c.w, c.h, sold ? '#D8D2C6' : '#FFFDF6', 6, 22);
    if (afford) {
      ctx.save();
      ctx.globalAlpha = 0.26 + Math.sin(t * 4 + c.i) * 0.14;
      ctx.strokeStyle = PALETTE.gold; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.roundRect(c.x - 4, c.y - 4, c.w + 8, c.h + 8, 26); ctx.stroke();
      ctx.restore();
    }

    optionIcon(ctx, o, c.x + 62, c.y + c.h / 2, 44);

    // 종류 뱃지
    ctx.fillStyle = sold ? '#A79C8C' : OPT_TINT[o.type];
    ctx.beginPath(); ctx.roundRect(c.x + 118, c.y + 16, 74, 24, 12); ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(c.x + 118, c.y + 16, 74, 24, 12); ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px system-ui, sans-serif';
    outlinedText(ctx, o.type === 'weapon' ? '무기' : '지원', c.x + 155, c.y + 29, 4);

    ctx.textAlign = 'left';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillStyle = sold ? '#8E8577' : PALETTE.woodDark;
    ctx.fillText(o.name, c.x + 118, c.y + 66);

    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillStyle = sold ? '#A79C8C' : '#5C6E7A';
    ctx.fillText(o.style, c.x + 118, c.y + 94);

    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = sold ? '#A79C8C' : '#9C8B6E';
    ctx.fillText(o.desc, c.x + 118, c.y + 120);

    priceTag(ctx, c.x + c.w - 62, c.y + 30, o.price, afford, sold);
  }

  const sk = L.skip;
  const pulse = boughtAny ? 1 + Math.sin(t * 3.4) * 0.014 : 1;
  ctx.save();
  ctx.translate(sk.x + sk.w / 2, sk.y + sk.h / 2);
  ctx.scale(pulse, pulse);
  ctx.translate(-(sk.x + sk.w / 2), -(sk.y + sk.h / 2));
  panel(ctx, sk.x, sk.y, sk.w, sk.h, boughtAny ? PALETTE.hpRed : PALETTE.parchment, 6, 22);
  ctx.textAlign = 'center';
  ctx.font = 'bold 32px system-ui, sans-serif';
  if (boughtAny) outlinedText(ctx, '나가기', sk.x + sk.w / 2, sk.y + sk.h / 2 + 1, 7);
  else {
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillText('그냥 나간다', sk.x + sk.w / 2, sk.y + sk.h / 2 + 1);
  }
  ctx.restore();
}

/* ============================================================ 일시정지 */

function pauseLayout(b = B) {
  return {
    resume: { x: 40, y: b.designH - 210, w: b.designW - 80, h: 86 },
    quit:   { x: 40, y: b.designH - 110, w: b.designW - 80, h: 68 },
  };
}

function pauseScreenHitTest(x, y, b = B) {
  const L = pauseLayout(b);
  if (inside(L.resume, x, y)) return { type: 'resume' };
  if (inside(L.quit, x, y)) return { type: 'quit' };
  return { type: 'none' };
}

/**
 * 일시정지 — "내가 지금 뭘 갖고 있지" 에 답하는 화면.
 *
 * 로그라이트에서 자기 빌드를 못 보면 다음 선택을 계획할 수 없다.
 * 여기서 유전자·무기·이번 판 구매를 한 번에 보여주고, 세이브가 무엇을 남기는지도 밝힌다.
 */
function renderPause(ctx, state, t, b = B) {
  const { world, owned } = state;
  const L = pauseLayout(b);
  const stats = deriveStats(normalizeOwned(owned), b);
  const wep = weaponById(world.weapon);

  ctx.fillStyle = 'rgba(12,24,34,0.93)';
  ctx.fillRect(0, 0, b.designW, b.designH);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 40px system-ui, sans-serif';
  outlinedText(ctx, '일시정지', b.designW / 2, 62, 8);
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = '#9FB4C4';
  ctx.fillText(`${formatTime(world.t)} 생존 중 · 웨이브 ${world.wave}`, b.designW / 2, 100);

  // --- 무기 ---
  let y = 130;
  panel(ctx, 30, y, b.designW - 60, 104, PALETTE.parchment, 5, 20);
  optionIcon(ctx, { type: 'weapon', id: world.weapon }, 80, y + 52, 36);
  ctx.textAlign = 'left';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText('지금 든 총', 130, y + 28);
  ctx.font = 'bold 25px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(wep.name, 130, y + 55);
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = '#8A7355';
  ctx.fillText(`${world.player.mag} / ${world.shot.mag}발 · 재장전 ${world.shot.reload.toFixed(1)}초`, 130, y + 82);

  // --- 폭탄 4축 ---
  y += 118;
  panel(ctx, 30, y, b.designW - 60, 96, '#FFFDF6', 5, 20);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = BRANCH.bomb.color;
  ctx.fillText('폭탄', 52, y + 24);
  const bombCells = [
    ['대기', `${stats.skillCooldown.toFixed(0)}초`],
    ['범위', `${stats.skillRadius.toFixed(0)}`],
    ['피해', `×${stats.skillDamageMul.toFixed(2)}`],
    ['밀치기', `${stats.skillKnockback.toFixed(0)}`],
  ];
  bombCells.forEach(([label, val], i) => {
    const cx = 52 + i * ((b.designW - 104) / 4);
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillStyle = '#9C8B6E';
    ctx.fillText(label, cx, y + 52);
    ctx.font = 'bold 21px system-ui, sans-serif';
    ctx.fillStyle = PALETTE.woodDark;
    ctx.fillText(val, cx, y + 76);
  });

  // --- 유전자 ---
  y += 110;
  // 단계형 트리 — "몇 개" 가 아니라 "몇 단계" 를 센다
  const own = normalizeOwned(owned);
  const perBranch = {};
  let learned = 0;
  for (const [id, lv] of Object.entries(own)) {
    if (id === 'root') continue;
    learned += lv;
    const br = NODE_BY_ID[id]?.branch;
    if (br) perBranch[br] = (perBranch[br] ?? 0) + lv;
  }
  const maxSteps = NODES.reduce((s2, n) => s2 + (n.id === 'root' ? 0 : n.max), 0);
  panel(ctx, 30, y, b.designW - 60, 128, '#FFFDF6', 5, 20);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText(`유전자  ${learned} / ${maxSteps} 단계`, 52, y + 24);
  Object.keys(BRANCH).forEach((key, i) => {
    const cnt = perBranch[key] ?? 0;
    const cx = 52 + (i % 2) * ((b.designW - 104) / 2);
    const cy = y + 56 + Math.floor(i / 2) * 36;
    ctx.fillStyle = BRANCH[key].color;
    ctx.beginPath(); ctx.arc(cx + 7, cy - 5, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = PALETTE.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = cnt ? PALETTE.woodDark : '#B7ADA0';
    ctx.fillText(`${BRANCH[key].name} ${cnt}`, cx + 22, cy - 4);
  });

  // --- 이번 판 획득 ---
  y += 142;
  const got = world.acquired ?? [];
  panel(ctx, 30, y, b.designW - 60, 132, '#FFFDF6', 5, 20);
  ctx.font = 'bold 17px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText('이번 판에 얻은 것', 52, y + 24);
  if (got.length === 0) {
    ctx.font = '15px system-ui, sans-serif';
    ctx.fillStyle = '#B7ADA0';
    ctx.fillText('아직 없다 — 보스를 잡으면 보급소가 열린다', 52, y + 56);
  } else {
    got.slice(-4).forEach((g, i) => {
      ctx.fillStyle = OPT_TINT[g.type] ?? '#8A7355';
      ctx.beginPath(); ctx.arc(59, y + 52 + i * 24, 6, 0, Math.PI * 2); ctx.fill();
      ctx.font = 'bold 16px system-ui, sans-serif';
      ctx.fillStyle = PALETTE.woodDark;
      ctx.fillText(g.name, 74, y + 53 + i * 24);
      ctx.font = '14px system-ui, sans-serif';
      ctx.fillStyle = '#9C8B6E';
      ctx.fillText(g.desc, 74 + ctx.measureText(g.name).width + 40, y + 53 + i * 24);
    });
  }

  // --- 세이브가 무엇을 남기는가 ---
  y += 144;
  ctx.font = '14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#8FA6B6';
  ctx.fillText('저장되는 것 — 생명에너지 · 유전자 · 최고 기록 (자동, 5초마다)', b.designW / 2, y);
  ctx.fillText('사라지는 것 — 이번 판의 돈 · 무기 · 상점 강화', b.designW / 2, y + 22);

  panel(ctx, L.resume.x, L.resume.y, L.resume.w, L.resume.h, PALETTE.hpRed, 6, 22);
  ctx.font = 'bold 34px system-ui, sans-serif';
  outlinedText(ctx, '계속하기', L.resume.x + L.resume.w / 2, L.resume.y + L.resume.h / 2 + 1, 7);

  panel(ctx, L.quit.x, L.quit.y, L.quit.w, L.quit.h, PALETTE.parchment, 5, 18);
  ctx.font = 'bold 22px system-ui, sans-serif';
  ctx.fillStyle = PALETTE.woodDark;
  ctx.fillText('포기하고 로비로', L.quit.x + L.quit.w / 2, L.quit.y + L.quit.h / 2 + 1);
}
