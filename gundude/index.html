/**
 * 입력 — 좌측 가상 스틱 + 우측 스킬 버튼 + 데스크톱 키보드.
 *
 * 스틱은 고정 위치가 아니라 "손가락이 닿은 자리에 생긴다".
 * 모바일에서 고정 스틱은 손가락이 조금만 어긋나도 못 잡는데,
 * 뜨는 스틱은 아무 데나 눌러도 바로 잡힌다 — 첫 10초 이탈을 줄이는 장치다.
 */

const TAP_SLOP = 8;   // 이만큼 안 움직이면 탭, 넘으면 드래그

function createInput(canvas, getViewport, layout, onTap = null, onPan = null) {
  let enabled = true;
  // 패닝 모드 — 로비 트리처럼 화면을 끌어 움직이는 곳에서 켠다.
  // 게임 중에는 꺼 둔다. 스틱은 손이 닿는 순간 잡혀야 하기 때문이다.
  let panMode = false;
  let drag = null;
  const state = {
    mx: 0, my: 0,
    skill: false,
    stick: null,          // {id, ox, oy, x, y}  게임 좌표
    skillHeld: false,
  };
  const keys = new Set();
  let skillEdge = false;

  function toGame(ev) {
    const rect = canvas.getBoundingClientRect();
    return screenToGame(getViewport(), ev.clientX, ev.clientY, rect.left, rect.top);
  }

  function inSkillButton(p) {
    const L = layout();
    return Math.hypot(p.x - L.skillX, p.y - L.skillY) <= L.skillR * 1.25;
  }

  function onDown(ev) {
    canvas.setPointerCapture?.(ev.pointerId);
    const p = toGame(ev);
    // 패닝 모드에서는 손을 뗄 때 판정한다 — 끌었으면 패닝, 안 끌었으면 탭.
    // 누르는 순간 탭으로 처리하면 트리를 끌 수가 없다.
    if (panMode) {
      drag = { id: ev.pointerId, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: 0 };
      return;
    }
    // 로비 탭이 소비한 이벤트는 여기서 끝낸다.
    // 안 그러면 "시작" 을 누른 그 손가락이 그대로 이동 스틱이 되어버린다.
    if (onTap?.(p.x, p.y)) return;
    if (!enabled) return;
    if (inSkillButton(p)) {
      state.skillHeld = true;
      skillEdge = true;
      return;
    }
    if (!state.stick) {
      state.stick = { id: ev.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y };
    }
  }

  function onMove(ev) {
    if (drag && drag.id === ev.pointerId) {
      const p = toGame(ev);
      const dx = p.x - drag.x, dy = p.y - drag.y;
      drag.moved += Math.hypot(dx, dy);
      drag.x = p.x; drag.y = p.y;
      if (drag.moved > TAP_SLOP) onPan?.(dx, dy);
      return;
    }
    if (!state.stick || state.stick.id !== ev.pointerId) return;
    const p = toGame(ev);
    state.stick.x = p.x;
    state.stick.y = p.y;
  }

  function onUp(ev) {
    if (drag && drag.id === ev.pointerId) {
      // 거의 안 움직였으면 탭이다. 끌었으면 이미 패닝으로 처리했다.
      if (drag.moved <= TAP_SLOP) onTap?.(drag.sx, drag.sy);
      drag = null;
      return;
    }
    if (state.stick && state.stick.id === ev.pointerId) state.stick = null;
    state.skillHeld = false;
  }

  canvas.addEventListener('pointerdown', onDown);
  canvas.addEventListener('pointermove', onMove);
  canvas.addEventListener('pointerup', onUp);
  canvas.addEventListener('pointercancel', onUp);
  canvas.addEventListener('pointerleave', onUp);

  window.addEventListener('keydown', (e) => {
    keys.add(e.key.toLowerCase());
    if (e.key === ' ' || e.key.toLowerCase() === 'j') skillEdge = true;
  });
  window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

  return {
    state,
    /** 로비에 있는 동안 스틱·스킬 입력을 잠근다. */
    setEnabled(v) {
      enabled = v;
      if (!v) { state.stick = null; state.skillHeld = false; skillEdge = false; }
    },
    /** 끌어서 화면을 움직이는 화면(로비 트리)에서 켠다. */
    setPanMode(v) {
      panMode = v;
      drag = null;
    },
    /** 매 프레임 호출. skill 은 눌린 순간 1회만 true (엣지 트리거). */
    read() {
      let mx = 0, my = 0;
      if (state.stick) {
        const L = layout();
        const dx = state.stick.x - state.stick.ox;
        const dy = state.stick.y - state.stick.oy;
        const d = Math.hypot(dx, dy);
        if (d > 1) {
          const k = Math.min(1, d / L.stickR) / d;
          mx = dx * k; my = dy * k;
        }
      } else {
        if (keys.has('a') || keys.has('arrowleft')) mx -= 1;
        if (keys.has('d') || keys.has('arrowright')) mx += 1;
        if (keys.has('w') || keys.has('arrowup')) my -= 1;
        if (keys.has('s') || keys.has('arrowdown')) my += 1;
      }
      const skill = skillEdge;
      skillEdge = false;
      return { mx, my, skill };
    },
    dispose() {
      canvas.removeEventListener('pointerdown', onDown);
      canvas.removeEventListener('pointermove', onMove);
      canvas.removeEventListener('pointerup', onUp);
      canvas.removeEventListener('pointercancel', onUp);
      canvas.removeEventListener('pointerleave', onUp);
    },
  };
}

/**
 * 화면 네 개: 타이틀 → 런 → (웨이브 돌파) 상점 → 런 → (사망) 로비 → 런
 *
 * 성장이 두 갈래라 화면도 둘이다.
 *   로비 = 골드로 사는 영구 스탯.  상점 = 부품으로 사는 무기.
 *
 * 부트 순서는 인증 요건이 정한 것이다:
 *   로딩 첫 프레임 → firstFrameReady() → 에셋·세이브 → gameReady()
 */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const loadingEl = document.getElementById('loading');

const bridge = createBridge();
let viewport = computeViewport(B.designW, B.designH, 1, 1, 1);
let lastW = -1, lastH = -1, lastDpr = -1;

/** resize 이벤트만 믿지 않는다 — 이벤트 + ResizeObserver + 매 프레임 치수 비교 3중. */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  const dpr = window.devicePixelRatio || 1;
  if (w === lastW && h === lastH && dpr === lastDpr) return false;
  lastW = w; lastH = h; lastDpr = dpr;
  viewport = computeViewport(B.designW, B.designH, w, h, dpr, 2);
  applyViewport(canvas, viewport);
  return true;
}

function drawLoadingFrame() {
  const { bufferW, bufferH } = viewport;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#28475F';
  ctx.fillRect(0, 0, bufferW, bufferH);
  ctx.fillStyle = '#EEE4CD';
  ctx.font = `bold ${Math.round(bufferH * 0.034)}px system-ui, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('GUN DUDE', bufferW / 2, bufferH / 2 - bufferH * 0.03);
  ctx.font = `${Math.round(bufferH * 0.017)}px system-ui, sans-serif`;
  ctx.fillText('loading…', bufferW / 2, bufferH / 2 + bufferH * 0.02);
}

/**
 * 다음 프레임을 기다리되 영원히 매달리지 않는다.
 * 실측 버그: 숨겨진 채 시작하면 rAF 가 발화하지 않아 firstFrameReady 가 영영 안 불린다.
 */
function nextFrame(timeoutMs = 500) {
  return new Promise((resolve) => {
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    requestAnimationFrame(fin);
    setTimeout(fin, timeoutMs);
  });
}

async function boot() {
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => {
    resize(); setTimeout(resize, 100); setTimeout(resize, 400);
  });
  window.visualViewport?.addEventListener('resize', resize);
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => resize()).observe(document.documentElement);

  drawLoadingFrame();
  await nextFrame();
  bridge.firstFrameReady();

  const [raw, images] = await Promise.all([bridge.loadRaw(), loadImages(IMAGES)]);
  const save = migrateSave(raw);
  let lastPersisted = migrateSave(raw);

  let mode = 'title';
  let world = null;
  let rng = makeRng(1);
  let elapsed = 0;
  let lastRun = 0, lastBio = 0, lastLost = 0, lastWave = 1, lastStage = 1;
  // 로비 안의 상태 — 지금 고른 노드와 보고 있는 화면.
  // 탭이 곧 구매가 아니므로 "무엇을 고르고 있는가" 를 들고 있어야 한다.
  let lobbySel = null;
  let lobbyView = 'tree';
  let lobbyPan = { x: 0, y: 0 };
  let askingReset = false;
  let autoPlay = false;
  let deathCine = null;   // 사망 슬로우모션 — 끝나야 로비로 넘어간다
  const aiMemory = {};

  const input = createInput(canvas, () => viewport, () => layoutFor(B), onTap, onPan);

  /** 로비 트리를 끌어 움직인다. */
  function onPan(dx, dy) {
    if (mode !== 'lobby' || lobbyView !== 'tree') return;
    lobbyPan = clampPan({ x: lobbyPan.x + dx, y: lobbyPan.y + dy }, B);
  }

  /** 로비에 들어갈 때마다 화면 상태를 초기화한다. */
  function enterLobby() {
    mode = 'lobby';
    lobbySel = null;
    lobbyView = 'tree';
    lobbyPan = { x: 0, y: 0 };
    askingReset = false;
    input.setEnabled(false);
    input.setPanMode(true);
  }
  input.setEnabled(false);

  function startRun() {
    rng = makeRng((Date.now() ^ (save.totalRuns * 2654435761)) & 0x7fffffff);
    world = createWorld(save.owned, B);
    deathCine = null;
    mode = 'run';
    input.setEnabled(true);
    input.setPanMode(false);
  }

  function endRun() {
    deathCine = null;
    lastRun = Math.floor(world.t);
    lastBio = world.bio;
    lastLost = world.bioLost;
    lastWave = world.wave;
    lastStage = stageOf(world.wave, B);
    save.bio += world.bio;      // 돈(금색)은 런과 함께 사라진다. 생명에너지만 남는다.
    save.totalRuns += 1;
    if (lastRun > save.bestScore) {
      save.bestScore = lastRun;
      bridge.sendScore(save.bestScore);   // 요건: 전송 점수 = 세이브 최고 기록
    }
    enterLobby();
    persist();
  }

  function openShop() {
    mode = 'shop';
    input.setEnabled(false);
  }

  function closeShop() {
    beginNextWave(world);
    mode = 'run';
    input.setEnabled(true);
  }

  /** @returns {boolean} 이 탭을 화면 UI 가 소비했는가 */
  function onTap(x, y) {
    if (mode === 'title') {
      const hit = titleHitTest(x, y, B);
      if (hit.type === 'start') startRun();
      else if (hit.type === 'lobby') enterLobby();
      return true;
    }
    if (mode === 'lobby') {
      const hit = lobbyHitTest(x, y, save.owned, lobbySel, lobbyView, lobbyPan, B);
      if (hit.type === 'start') startRun();
      else if (hit.type === 'totals') lobbyView = 'totals';
      else if (hit.type === 'options') { lobbyView = 'options'; askingReset = false; }
      else if (hit.type === 'closeOverlay') { lobbyView = 'tree'; askingReset = false; }
      else if (hit.type === 'resetAsk') askingReset = true;
      else if (hit.type === 'resetDo') {
        // 되돌릴 수 없는 동작이라 두 번 눌러야 여기 온다.
        Object.assign(save, defaultSave());
        lastRun = 0; lastBio = 0; lastLost = 0; lastWave = 1; lastStage = 1;
        askingReset = false;
        lobbyView = 'tree';
        lobbySel = null;
        persist();
      } else if (hit.type === 'select') lobbySel = hit.id;
      else if (hit.type === 'deselect') lobbySel = null;
      else if (hit.type === 'learn') {
        // 배우기는 정보창에서 한 번 더 눌러야 일어난다. 노드를 탭하는 것만으로는 안 산다.
        const r = learnNode(hit.id, save.bio, save.owned);
        if (r.ok) { save.bio = r.bio; save.owned = r.owned; persist(); }
      }
      return true;
    }
    if (mode === 'shop') {
      const hit = shopHitTest(x, y, world.shop.options, B);
      if (hit.type === 'skip') closeShop();
      else if (hit.type === 'buy') {
        // 한 번 사고 화면이 닫히면 "무엇을 살까" 가 "무엇을 포기할까" 가 된다.
        // 돈이 되는 만큼 사고, 나가기는 직접 누른다.
        const opt = world.shop.options[hit.index];
        if (opt && !opt.bought && world.money >= opt.price) {
          world.money -= opt.price;
          opt.bought = true;
          applyShopOption(world, opt);
        }
      }
      return true;
    }
    if (mode === 'pause') {
      const hit = pauseScreenHitTest(x, y, B);
      if (hit.type === 'resume') { mode = 'run'; input.setEnabled(true); }
      else if (hit.type === 'quit') { world.over = true; world.killedBy = '스스로 물러났다'; endRun(); }
      return true;
    }
    // 런 중 — 일시정지 버튼만 탭을 가로챈다. 나머지는 스틱이 가져간다.
    if (mode === 'run' && world && !world.over && pauseHitTest(x, y, B)) {
      mode = 'pause';
      input.setEnabled(false);
      persist();
      return true;
    }
    return false;
  }

  function update(dt) {
    elapsed += dt;
    if (mode !== 'run' || !world) return;

    // 사망 연출 — 시간이 늘어지며 죽은 자리로 화면이 파고든다.
    // 이 시간이 없으면 "왜 죽었는지" 를 볼 새도 없이 로비로 튕긴다.
    if (deathCine) {
      deathCine.t += dt;
      const k = Math.min(1, deathCine.t / deathCine.life);
      stepWorld(world, dt * (1 - 0.86 * k), { mx: 0, my: 0, skill: false }, rng);
      if (deathCine.t >= deathCine.life) endRun();
      return;
    }

    const inp = autoPlay ? decide(world, aiMemory) : input.read();
    if (autoPlay) input.read();
    const wasOver = world.over;
    stepWorld(world, dt, inp, rng);
    if (world.over && !wasOver) {
      if (autoPlay) { endRun(); return; }
      deathCine = { t: 0, life: B.deathCineSec };
      input.setEnabled(false);
      return;
    }
    if (world.shop) openShop();
  }

  function renderFrame() {
    resize();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const s = viewport.scale * viewport.pixelRatio;
    ctx.setTransform(s, 0, 0, s, 0, 0);

    if (mode === 'run' && world) {
      if (deathCine) {
        const k = Math.min(1, deathCine.t / deathCine.life);
        const ease = 1 - (1 - k) ** 3;
        renderWorld(ctx, world, images, elapsed, null,
          { x: world.player.x, y: world.player.y, zoom: 1 + 0.85 * ease, hideHud: true });
        drawDeathCine(ctx, world, k);
      } else {
        renderWorld(ctx, world, images, elapsed, input.state.stick);
      }
    } else if (mode === 'pause' && world) {
      renderWorld(ctx, world, images, elapsed, null, { zoom: 1, hideHud: true });
      renderPause(ctx, { world, owned: save.owned }, elapsed, B);
    } else if (mode === 'shop' && world) {
      renderWorld(ctx, world, images, elapsed, null, { zoom: 1, hideHud: true });
      renderShop(ctx, {
        options: world.shop.options, money: world.money, stage: world.shop.stage,
        currentWeapon: world.weapon, hp: world.player.hp, maxHp: world.player.maxHp,
      }, elapsed, B);
    } else if (mode === 'lobby') {
      if (lobbyView === 'totals') {
        renderTotals(ctx, { owned: save.owned, bio: save.bio }, elapsed, B);
      } else if (lobbyView === 'options') {
        renderOptions(ctx, {
          askingReset, bio: save.bio,
          learned: deriveStats(save.owned).learned,
        }, elapsed, B);
      } else {
        renderLobby(ctx, {
          bio: save.bio, owned: save.owned, best: save.bestScore,
          lastRun, lastBio, lastLost, lastWave, lastStage,
          selected: lobbySel, pan: lobbyPan,
        }, elapsed, B);
      }
    } else {
      renderTitle(ctx, { best: save.bestScore, bio: save.bio }, elapsed, B);
    }
  }

  const loop = createLoop({ update, render: renderFrame });

  async function persist() {
    if (saveEquals(save, lastPersisted)) return;
    const text = serializeSave(save);
    if (await bridge.saveRaw(text)) lastPersisted = migrateSave(text);
  }

  let autoSave = null;
  const startAutoSave = () => { stopAutoSave(); autoSave = setInterval(persist, 5000); };
  const stopAutoSave = () => { if (autoSave !== null) { clearInterval(autoSave); autoSave = null; } };

  // 요건: "MUST pause all execution" — rAF 자체를 끊는다
  bridge.onPause(() => { loop.stop(); stopAutoSave(); persist(); });
  bridge.onResume(() => { loop.start(); startAutoSave(); });

  let audioEnabled = bridge.isAudioEnabled();
  bridge.onAudioEnabledChange((v) => { audioEnabled = v; });

  loadingEl?.remove();
  loop.start();
  startAutoSave();
  bridge.gameReady();

  if (!bridge.isReal) {
    globalThis.__dev = {
      bridge, loop, input, save, images: () => images,
      world: () => world, mode: () => mode, viewport: () => viewport,
      stats: () => deriveStats(save.owned),
      renderFrame, startRun, closeShop,
      auto: (on = true) => { autoPlay = on; return `autoplay ${on ? 'ON' : 'OFF'}`; },
      grant: (ids) => {
        const next = { ...normalizeOwned(save.owned) };
        for (const id of ids ?? []) next[id] = (next[id] ?? 0) + 1;
        save.owned = normalizeOwned(next); persist(); return save.owned;
      },
      grantAll: () => {
        save.owned = normalizeOwned(Object.fromEntries(NODES.map((n) => [n.id, n.max])));
        persist(); return Object.keys(save.owned).length;
      },
      lobby: (view = 'tree', sel = null) => { enterLobby(); lobbyView = view; lobbySel = sel; renderFrame(); return view; },
      pan: (x, y) => { lobbyPan = clampPan({ x, y }, B); renderFrame(); return lobbyPan; },
      bio: (n) => { save.bio += n; return save.bio; },
      give: (id) => { if (world) equipWeapon(world, id); return world?.weapon; },
      /** 특정 웨이브로 건너뛴다 (보스 검수용) */
      warp: (n) => {
        if (mode !== 'run') startRun();
        world.enemies.length = 0; world.hostileShots.length = 0;
        world.groups = []; world.groupLeft = 0; world.waveLeft = 0;
        world.wave = Math.max(1, Math.floor(n)) - 1;
        world.bossActive = false; world.cine = null; world.pendingShop = null;
        beginNextWave(world);
        return world.wave;
      },
      pauseScreen: () => { mode = 'pause'; input.setEnabled(false); renderFrame(); return 'pause'; },
      /** rAF 없이 n 초 진행하고 한 프레임 그린다 (백그라운드 탭 검증용) */
      fast: (sec, autoShop = true) => {
        if (mode === 'title' || mode === 'lobby') startRun();
        for (let i = 0; i < Math.round(sec * 60); i += 1) {
          if (mode === 'shop') { if (autoShop) closeShop(); else break; }
          if (mode !== 'run') break;
          elapsed += 1 / 60;
          update(1 / 60);
        }
        renderFrame();
        return {
          mode, t: world ? +world.t.toFixed(1) : 0, wave: world?.wave,
          hp: world ? Math.round(world.player.hp) : 0,
          weapon: world?.weapon, money: world?.money, bio: save.bio,
        };
      },
      pause: () => bridge.debug?.firePause(),
      resume: () => bridge.debug?.fireResume(),
      audioEnabled: () => audioEnabled,
    };
    console.info('[dev] __dev.auto(true) · __dev.fast(60) · __dev.give("shotgun") · __dev.bio(999)');
  }
}

boot().catch((err) => {
  console.error('[boot] failed', err);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#28475F';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#DD3131';
  ctx.font = '24px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('failed to start', canvas.width / 2, canvas.height / 2);
});

</script>
